<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا | جمعية رواحم لرعاية الأيتام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F1; --surface:#FFFFFF; --ink:#1C2321; --ink-soft:#5B655F;
  --primary:#1F4B43; --primary-dark:#123028; --primary-tint:#EDF3F1;
  --gold:#C89B3C; --gold-tint:#F6EDD8; --gold-deep:#9E7A2B;
  --border:#E3DECF; --rose:#B4483A;
}
*{box-sizing:border-box;}
body{margin:0; font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--ink); direction:rtl; line-height:1.9;}
a{color:inherit;}
.wrap{max-width:840px; margin:0 auto; padding:0 22px;}
header{background:var(--primary-dark); padding:18px 0;}
.nav-row{display:flex; align-items:center; justify-content:space-between;}
.logo{display:flex; align-items:center; gap:10px;}
.logo-mark{width:32px; height:32px; background:var(--primary); border-radius:9px; display:flex; align-items:center; justify-content:center;}
.logo-text{font-size:16px; font-weight:800; color:#fff;}
.back-link{font-size:13.5px; font-weight:700; color:#EAF0EE; text-decoration:none; display:flex; align-items:center; gap:6px;}
main{padding:48px 0 70px;}
.badge{display:inline-block; font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:20px; background:var(--gold-tint); color:var(--gold-deep); margin-bottom:16px;}
h1{font-size:28px; font-weight:900; color:var(--primary-dark); margin:0 0 8px;}
.updated{font-size:12.5px; color:var(--ink-soft); margin-bottom:32px;}
h2{font-size:18px; font-weight:800; color:var(--primary-dark); margin:34px 0 10px;}
p, li{font-size:14.5px; color:var(--ink-soft);}
ul{padding-inline-start:22px; margin:0 0 12px;}
li{margin-bottom:6px;}
.note{background:var(--primary-tint); border-radius:12px; padding:16px 18px; font-size:13.5px; color:var(--primary-dark); margin-top:30px;}
footer{background:var(--primary-dark); color:#C9D6D0; padding:26px 0; text-align:center; font-size:12.5px;}
footer a{color:#EAF0EE; text-decoration:underline;}
.c-lines{display:grid; gap:10px; margin:22px 0 26px;}
.c-line{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14.5px;}
.c-line b{min-width:64px; color:var(--primary-dark);} .c-line a{color:var(--primary); font-weight:700; text-decoration:none;}
.form{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; display:grid; gap:14px; position:relative;}
.form label{font-size:13.5px; font-weight:700; display:block; margin-bottom:5px; color:var(--ink);}
.form input,.form textarea,.form select{width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:9px; font:inherit; font-size:16px; background:#fff; color:var(--ink);}
.form textarea{min-height:120px; resize:vertical;}
.form .hp{position:absolute; top:0; right:0; width:1px; height:1px; padding:0; border:0; opacity:0; overflow:hidden; pointer-events:none;}
.btn-send{background:var(--primary); color:#fff; border:0; font:inherit; font-weight:800; font-size:15px; padding:12px 22px; border-radius:12px; cursor:pointer;}
.result{margin-top:4px; padding:14px; border-radius:10px; background:var(--primary-tint); color:var(--primary-dark); font-size:14px; font-weight:600; display:none; line-height:1.9;}
.result.show{display:block;} .result.warn{background:var(--gold-tint); color:var(--gold-deep);}
</style>
</head>
<body>
<header>
  <div class="wrap nav-row">
    <div class="logo"><div class="logo-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3L4 7v5c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V7l-8-4z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div><div class="logo-text">جمعية رواحم</div></div>
    <a href="index.html" class="back-link">→ العودة للرئيسية</a>
  </div>
</header>
<main>
  <div class="wrap">
<span class="badge">تواصل معنا</span>
<h1>يسعدنا سماعك</h1>
<p>للاستفسار أو الاقتراح أو التطوع أو الشراكة، راسلنا عبر القنوات التالية أو أرسل رسالتك من النموذج.</p>
<div class="c-lines" id="cLines"></div>
<form class="form" id="contactForm" novalidate>
  <div><label for="cName">الاسم</label><input id="cName" autocomplete="name" required></div>
  <div><label for="cPhone">رقم الجوال (اختياري)</label><input id="cPhone" type="tel" inputmode="tel" autocomplete="tel"></div>
  <div><label for="cType">نوع الرسالة</label><select id="cType"><option>استفسار</option><option>اقتراح</option><option>شكوى</option><option>تطوع</option><option>شراكة</option></select></div>
  <div><label for="cMsg">الرسالة</label><textarea id="cMsg" required></textarea></div>
  <input class="hp" id="cHp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button class="btn-send" type="submit">إرسال</button>
  <div class="result" id="contactResult" role="status" aria-live="polite"></div>
</form>
  </div>
</main>
<footer>
  <div class="wrap">© جمعية رواحم لرعاية الأيتام — جميع الحقوق محفوظة · مرخّصة من وزارة الموارد البشرية والتنمية الاجتماعية — رقم الترخيص 1000905700</div>
</footer>
<script>
/* نفس بيانات التواصل المعتمدة في الصفحة الرئيسية — عدّلها في الموضعين عند أي تغيير */
const SITE={ phone:'966538002007', email:'rawahim.sa@gmail.com', whatsapp:'966538002007' };
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=String(SITE.phone).replace(/\D/g,'');
const rows=[['العنوان','نجران، المملكة العربية السعودية']];
if(SITE.phone) rows.push(['الجوال',`<a href="tel:+${digits}" dir="ltr">${digits.indexOf('966')===0?'0'+digits.slice(3):esc(SITE.phone)}</a>`]);
if(SITE.email) rows.push(['البريد',`<a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>`]);
if(SITE.whatsapp) rows.push(['واتساب',`<a href="https://wa.me/${String(SITE.whatsapp).replace(/\D/g,'')}" rel="noopener">راسلنا</a>`]);
document.getElementById('cLines').innerHTML=rows.map(r=>`<div class="c-line"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('');
const want=new URLSearchParams(location.search).get('type');
if(want){ const o=[...document.getElementById('cType').options].find(x=>x.text===want); if(o) o.selected=true; }
document.getElementById('contactForm').addEventListener('submit',e=>{
  e.preventDefault();
  const res=document.getElementById('contactResult');
  if(document.getElementById('cHp').value) return;
  const name=document.getElementById('cName').value.trim(), msg=document.getElementById('cMsg').value.trim();
  const type=document.getElementById('cType').value, ph=document.getElementById('cPhone').value.trim();
  res.className='result show warn';
  if(!name||msg.length<5){ res.textContent='فضلًا أدخل الاسم ورسالة واضحة.'; return; }
  const text=`${type}\nالاسم: ${name}${ph?'\nالجوال: '+ph:''}\n\n${msg}`;
  if(SITE.whatsapp){
    window.open('https://wa.me/'+String(SITE.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent(text),'_blank','noopener');
    res.className='result show'; res.textContent='تم فتح واتساب لإرسال رسالتك. شكرًا لتواصلك.';
  } else if(SITE.email){
    location.href='mailto:'+SITE.email+'?subject='+encodeURIComponent('رسالة من الموقع: '+type)+'&body='+encodeURIComponent(text);
    res.className='result show'; res.textContent='تم فتح تطبيق البريد لإرسال رسالتك.';
  }
});
</script>
</body>
</html>
