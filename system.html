<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نظام رواحم للأرشفة والحوكمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<style>
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --ink:#1C2624; --ink-soft:#4E5B63;
  --primary:#0E4D3B; --primary-dark:#0A3A2C; --primary-soft:#E7EFEA;
  --accent:#8B6B56; --accent-soft:#EFE7DD;
  --sage:#6B8F7A; --sand:#D9D2C6;
  --border:#E3DDD1;
  --danger:#B4483A; --danger-soft:#F7E7E3;
  --warn:#C9862B; --warn-soft:#F8ECD9;
  --success:#3F7D5C; --success-soft:#E7F1EA;
  --info:#3B6E8F; --info-soft:#E6EEF2;
  --shadow-sm:0 2px 8px -2px rgba(18,48,40,.06);
  --shadow-md:0 10px 28px -12px rgba(18,48,40,.16);
  --shadow-lg:0 22px 48px -18px rgba(18,48,40,.28);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans Arabic',sans-serif; background:var(--bg); color:var(--ink);
  min-height:100vh; direction:rtl;
}
button,input,select,textarea{font-family:inherit; font-size:15px;}
h1,h2,h3,h4{margin:0; font-weight:800;}
p{margin:0;}
.hidden{display:none !important;}

/* ---------- Login ---------- */
#loginScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(31,75,67,0.08), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(200,155,60,0.10), transparent 40%),
    var(--bg);
  padding:20px;
}
.login-card{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  padding:38px 30px; width:100%; max-width:380px; box-shadow:0 18px 40px -20px rgba(31,75,67,0.35);
}
.brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.brand-mark{
  width:46px; height:46px; border-radius:12px; background:#fff; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:4px;
}
.brand-title{font-size:19px; font-weight:800; color:var(--primary-dark); line-height:1.3;}
.brand-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13.5px; font-weight:700; margin-bottom:6px; color:var(--ink);}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px;
  background:#fff; color:var(--ink); outline:none; transition:border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.btn{
  border:none; border-radius:10px; padding:11px 18px; font-weight:700; cursor:pointer;
  font-size:14.5px; transition:filter .15s, transform .05s; display:inline-flex; align-items:center; gap:6px;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-accent{background:var(--accent); color:#2b2210;}
.btn-outline{background:transparent; color:var(--primary); border:1.5px solid var(--primary);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-ghost{background:transparent; color:var(--ink-soft);}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:8px;}
.btn-block{width:100%; justify-content:center;}
.login-error{
  background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:9px 12px;
  font-size:13px; margin-bottom:14px; font-weight:700; display:none;
}
.demo-box{
  margin-top:18px; padding:12px 14px; background:var(--primary-soft); border-radius:10px;
  font-size:12.5px; color:var(--primary-dark); line-height:1.9;
}
.demo-box b{font-weight:800;}

/* ---------- App shell ---------- */
#app{display:none; min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:252px; background:linear-gradient(190deg, var(--primary-dark) 0%, #082A20 100%); color:#EAF0EE; flex-shrink:0;
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; right:0; z-index:40;
  transition:transform .2s; box-shadow:var(--shadow-lg);
}
.sidebar-head{padding:22px 18px 16px; border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-logo{width:42px; height:42px; background:#fff; border-radius:11px; padding:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 12px rgba(0,0,0,.25);}
.sidebar-logo img{width:100%; height:100%; object-fit:contain;}
.sidebar-title{font-size:15.5px; font-weight:800; color:#fff;}
.sidebar-sub{font-size:11px; color:#9CB4AC; margin-top:3px;}
.nav{padding:14px 12px; flex:1; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:10px;
  color:#B9CBC4; cursor:pointer; font-size:14px; font-weight:600; margin-bottom:2px;
  transition:background .15s, color .15s;
}
.nav-item:hover{background:rgba(255,255,255,0.07); color:#fff;}
.nav-item.active{background:linear-gradient(90deg, rgba(139,107,86,.28), rgba(139,107,86,.08)); color:#fff; box-shadow:inset 3px 0 0 var(--accent);}
.nav-icon{width:18px; height:18px; flex-shrink:0;}
.sidebar-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,0.08); font-size:11.5px; color:#7E9992;}
.main{flex:1; margin-right:252px; min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border); padding:14px 26px;
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20;
  box-shadow:var(--shadow-sm);
}
.topbar-title{font-size:18px; font-weight:800;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.topbar-search{display:none;}
.topbar-search input{padding:10px 16px; border-radius:24px; border:1.5px solid var(--border); background:var(--bg); font-size:13.5px; width:230px; transition:border-color .2s, box-shadow .2s;}
.topbar-search input:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft);}
@media (min-width:760px){ .topbar-search{display:block;} }
.notif-btn{position:relative; background:var(--bg); border:1px solid var(--border); width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); flex-shrink:0;}
.notif-btn:hover{color:var(--primary); border-color:var(--primary);}
.notif-dot{position:absolute; top:6px; left:7px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:1.5px solid var(--surface);}
.user-chip{display:flex; align-items:center; gap:9px; padding:6px 6px 6px 12px; border-radius:30px; background:var(--bg); border:1px solid var(--border);}
.user-avatar{width:30px; height:30px; border-radius:50%; background:var(--accent); color:#2b2210; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.user-meta{font-size:12.5px; line-height:1.3;}
.user-meta b{display:block; font-size:13.5px;}
.hamburger{display:none; background:none; border:none; cursor:pointer; padding:4px;}
.content{padding:22px 24px 60px; max-width:1180px; width:100%; margin:0 auto;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:35; display:none;}

/* ---------- Common UI ---------- */
.page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.page-head h2{font-size:21px;}
.page-desc{color:var(--ink-soft); font-size:13.5px; margin-top:4px; max-width:60ch;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; border-right:4px solid var(--primary); box-shadow:var(--shadow-sm); transition:box-shadow .2s, transform .2s;}
.stat-card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
.stat-card.accent{border-right-color:var(--accent);}
.stat-card.danger{border-right-color:var(--danger);}
.stat-card.info{border-right-color:var(--info);}
.stat-num{font-size:26px; font-weight:800; color:var(--primary-dark);}
.stat-label{font-size:12.5px; color:var(--ink-soft); margin-top:3px; font-weight:600;}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 18px 8px; margin-bottom:18px; box-shadow:var(--shadow-sm); transition:box-shadow .2s;}
.panel:hover{box-shadow:var(--shadow-md);}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
.panel-head h3{font-size:15.5px;}
.badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.badge-success{background:var(--success-soft); color:var(--success);}
.badge-warn{background:var(--warn-soft); color:var(--warn);}
.badge-danger{background:var(--danger-soft); color:var(--danger);}
.badge-info{background:var(--info-soft); color:var(--info);}
.badge-accent{background:var(--accent-soft); color:#8a6a1f;}
table{width:100%; border-collapse:collapse;}
th{
  text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:700; padding:9px 8px;
  border-bottom:1.5px solid var(--border); white-space:nowrap;
}
td{padding:11px 8px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.empty-state{padding:38px 20px; text-align:center; color:var(--ink-soft);}
.empty-state h4{color:var(--ink); margin-bottom:6px; font-size:15px;}
.empty-state p{font-size:13px; max-width:40ch; margin:0 auto;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.toolbar input, .toolbar select{padding:9px 12px; border:1.5px solid var(--border); border-radius:9px; background:#fff;}
.tag-pill{background:var(--bg); border:1px solid var(--border); padding:3px 10px; border-radius:20px; font-size:11.5px;}

/* Kanban for approvals */
.kanban{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; align-items:start;}
.kcol{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px; min-height:80px; box-shadow:var(--shadow-sm);}
.kcol-head{display:flex; align-items:center; justify-content:space-between; padding:4px 4px 10px; border-bottom:1px solid var(--border); margin-bottom:8px;}
.kcol-head b{font-size:13px;}
.kcount{background:var(--primary-soft); color:var(--primary-dark); border-radius:20px; padding:1px 9px; font-size:11.5px; font-weight:800;}
.kcard{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; cursor:pointer;}
.kcard:hover{border-color:var(--primary);}
.kcard-title{font-size:13px; font-weight:700; margin-bottom:4px;}
.kcard-meta{font-size:11px; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center; gap:6px;}

/* Modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(28,35,33,0.5); display:none; align-items:center; justify-content:center; z-index:60; padding:16px;}
.modal{background:var(--surface); border-radius:16px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:22px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.close-x{background:none; border:none; cursor:pointer; font-size:20px; color:var(--ink-soft); line-height:1;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-grid .full{grid-column:1/-1;}
.modal-actions{display:flex; justify-content:flex-start; gap:8px; margin-top:18px; border-top:1px solid var(--border); padding-top:14px;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

/* Toast */
#toastHost{position:fixed; bottom:18px; left:18px; z-index:80; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:10px; font-size:13.5px; box-shadow:0 10px 25px -10px rgba(0,0,0,0.4); animation:slideup .18s ease;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
@keyframes slideup{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.drive-status{display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:12px; background:var(--info-soft); margin-bottom:16px;}
.drive-status.connected{background:var(--success-soft);}
.drive-dot{width:9px; height:9px; border-radius:50%; background:var(--info); flex-shrink:0;}
.drive-status.connected .drive-dot{background:var(--success);}

/* ---------- Dashboard v2 ---------- */
.dash-topline{
  display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; flex-wrap:wrap;
  background:linear-gradient(120deg, var(--primary-dark) 0%, var(--primary) 100%); border-radius:18px; padding:22px 26px; color:#fff;
  position:relative; overflow:hidden; box-shadow:var(--shadow-md);
}
.dash-topline::after{content:''; position:absolute; left:-40px; top:-60px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(139,107,86,.35), transparent 70%);}
.dash-title{position:relative; z-index:1;}
.dash-title h2{font-size:20px; color:#fff;}
.dash-title p{font-size:12.5px; color:#CFE0D8; margin-top:4px;}
.icon-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px;}
.icon-stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:17px; display:flex; align-items:center; gap:13px; box-shadow:var(--shadow-sm); transition:box-shadow .22s, transform .22s;}
.icon-stat:hover{box-shadow:var(--shadow-md); transform:translateY(-3px);}
.icon-stat .isicon{width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.icon-stat .isnum{font-size:23px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums;}
.icon-stat .islabel{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.dash-grid{display:grid; grid-template-columns:0.85fr 1.15fr; gap:16px; margin-bottom:16px;}
.sec-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border);}
.sec-row:last-child{border-bottom:none;}
.sec-label{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink);}
.qs-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.qs-cell{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center;}
.qs-cell b{display:block; font-size:22px; font-weight:800; color:var(--primary-dark);}
.qs-cell span{font-size:11.5px; color:var(--ink-soft); margin-top:4px; display:block;}
@media (max-width:900px){ .dash-grid{grid-template-columns:1fr;} }
.upload-drop{border:2px dashed var(--border); border-radius:14px; padding:26px 16px; text-align:center; background:var(--surface); cursor:pointer; margin-bottom:16px;}
.upload-drop:hover{border-color:var(--primary);}
.upload-drop .updicon{width:44px; height:44px; margin:0 auto 10px; border-radius:12px; background:var(--primary-soft); display:flex; align-items:center; justify-content:center;}
.upload-drop h4{font-size:14px; margin-bottom:4px;}
.upload-drop p{font-size:11.5px; color:var(--ink-soft);}
.cat-list{list-style:none; margin:0; padding:0;}
.cat-list li{display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px;}
.cat-list li:last-child{border-bottom:none;}
.cat-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-left:8px;}
.doc-type-icon{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; flex-shrink:0;}
.chart-tabs{display:flex; gap:6px;}
.chart-tab{padding:5px 12px; border-radius:8px; font-size:11.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); background:var(--bg); border:1px solid var(--border);}
.chart-tab.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.bar-chart{display:flex; align-items:flex-end; gap:10px; height:140px; padding-top:10px;}
.bar-chart .bcol{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.bar-chart .bfill{width:100%; max-width:30px; border-radius:8px 8px 3px 3px; background:linear-gradient(180deg, var(--sage) 0%, var(--primary) 100%); transition:height .4s ease;}
.bar-chart .blabel{font-size:10.5px; color:var(--ink-soft);}
.donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.donut{width:130px; height:130px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.donut-center{width:76px; height:76px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;}
.donut-center b{font-size:17px;}
.donut-center span{font-size:9.5px; color:var(--ink-soft);}
.donut-legend{list-style:none; margin:0; padding:0; font-size:12px; flex:1; min-width:150px;}
.donut-legend li{display:flex; align-items:center; justify-content:space-between; padding:4px 0;}
.quick-actions{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px;}
.qa-btn{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px; text-align:center; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--ink); transition:box-shadow .2s, transform .2s, border-color .2s;}
.qa-btn:hover{border-color:var(--primary); color:var(--primary); box-shadow:var(--shadow-md); transform:translateY(-2px);}
.qa-btn .qaicon{width:32px; height:32px; margin:0 auto 8px; border-radius:9px; background:var(--primary-soft); display:flex; align-items:center; justify-content:center;}
.alert-row{display:flex; align-items:center; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--border); font-size:12.5px;}
.alert-row:last-child{border-bottom:none;}
.alert-dot{width:8px; height:8px; border-radius:50%; background:var(--danger); flex-shrink:0;}

/* Confirm dialog reuses modal */
@media (max-width:900px){
  .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-right:0;}
  .hamburger{display:block;}
  .form-grid{grid-template-columns:1fr;}
  .content{padding:16px 14px 50px;}
  .topbar{padding:12px 14px;}
}
@media print{
  .sidebar, .topbar, .toolbar, .row-actions, .no-print{display:none !important;}
  .main{margin-right:0;}
  body{background:#fff;}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark"><img src="logo-icon.png" alt="شعار رواحم" style="width:100%; height:100%; object-fit:contain;"></div>
      <div>
        <div class="brand-title">جمعية رواحم لرعاية الأيتام</div>
        <div class="brand-sub">نظام الأرشفة والحوكمة الإلكتروني</div>
      </div>
    </div>
    <div id="setupWarning" style="display:none; background:#F7E7E3; color:#B4483A; border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:14px; font-weight:700; line-height:1.7;">
      لم يتم إعداد قاعدة البيانات بعد. عدّل قيم firebaseConfig في أعلى ملف الكود (بعد إنشاء مشروع Firebase) حتى يعمل حفظ البيانات فعليًا.
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="field"><label>اسم المستخدم أو البريد الإلكتروني</label><input id="loginUser" placeholder="اكتب اسم المستخدم أو بريدك الإلكتروني"></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" placeholder="اكتب كلمة المرور"></div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
    <div style="text-align:center; margin-top:10px;">
      <a href="#" onclick="forgotPassword(); return false;" style="font-size:12.5px; color:var(--primary); text-decoration:underline;">نسيت كلمة المرور؟</a>
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
  <div class="shell">

<script>
/* =========================================================
   RAHAM — نظام الأرشفة والحوكمة لجمعية رواحم
   تخزين سحابي مشترك عبر Firebase Firestore + تسجيل دخول آمن عبر Firebase Authentication
   ========================================================= */

const KEYS = {users:'raham:users', documents:'raham:documents', orphans:'raham:orphans', requests:'raham:requests', decisions:'raham:decisions', audit:'raham:auditlog', driveconfig:'raham:driveconfig', categories:'raham:categories', settings:'raham:settings', families:'raham:families', appointments:'raham:appointments'};
let DB = {users:[], documents:[], orphans:[], requests:[], decisions:[], audit:[], driveconfig:{}, categories:[], settings:{}, families:[], appointments:[]};
let currentUser = null;
let currentView = 'dashboard';
const OVERDUE_DAYS = 2;
const WIP_LIMIT = 6;

const ROLE_LABEL = {admin:'مدير النظام', employee:'موظف الجمعية', board:'عضو مجلس إدارة', auditor:'مراجع خارجي (قراءة فقط)'};

/* ---------------- storage helpers ---------------- */
/* ===== Firebase (Firestore) — real persistent shared database =====
   PASTE YOUR OWN CONFIG BELOW (from Firebase Console > Project settings > Your apps > Web app).
   Everything else in this file works unchanged once this is filled in. */
const firebaseConfig = {
  apiKey: "AIzaSyCVt8BV-SpdIRkDEuZLHUZ1eTfmtqMDqSo",
  authDomain: "rawahem-system.firebaseapp.com",
  projectId: "rawahem-system",
  storageBucket: "rawahem-system.firebasestorage.app",
  messagingSenderId: "488477149213",
  appId: "1:488477149213:web:3f63203c6857c047ca5ef4"
};
let db = null;
let auth = null;
let firebaseReady = false;
let authReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  firebaseReady = true;
  authReady = true;
}catch(e){ console.error('Firebase init failed', e); }

/* ===== Cloud Functions (سيرفر آمن) ===== */
let fns = null;
try{ fns = firebase.app().functions('europe-west1'); }catch(e){ console.warn('functions unavailable', e); }
async function callFn(name, data){
  if(!fns) throw {code:'functions/unavailable'};
  const r = await fns.httpsCallable(name)(data||{});
  return r.data;
}
/* بعد دخول المدير: نفعّل صلاحية "admin" الموثّقة مرة واحدة، ثم نرحّل صلاحيات الحسابات الحالية */
async function ensureAdminClaims(){
  try{
    if(!auth.currentUser || !fns) return;
    let tok = await auth.currentUser.getIdTokenResult();
    if(tok.claims.role==='admin') return;
    await callFn('bootstrapAdmin');
    await auth.currentUser.getIdToken(true);
    try{ await callFn('adminSyncClaims'); }catch(e){ console.warn('syncClaims', e); }
    toast('تم تفعيل الحماية المتقدمة لحساب المدير','ok');
  }catch(e){ console.warn('ensureAdminClaims', e && e.code); }
}

/* توليد بريد إلكتروني داخلي ثابت من اسم المستخدم (لحسابات الدخول القديمة التي لا تملك بريدًا حقيقيًا بعد) */
function usernameToEmail(u){
  const clean = (u||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
  return (clean || 'user') + '@rawahem.local';
}
/* إنشاء حساب دخول آمن جديد (Firebase Auth) دون تسجيل خروج المدير الحالي — باستخدام تطبيق Firebase ثانوي مؤقت */
async function createAuthUserSecondary(email, password){
  const secName = 'Secondary_' + Date.now();
  const secApp = firebase.initializeApp(firebaseConfig, secName);
  try{
    const cred = await secApp.auth().createUserWithEmailAndPassword(email, password);
    const newUid = cred.user.uid;
    try{ await secApp.auth().signOut(); }catch(e){}
    await secApp.delete();
    return newUid;
  }catch(e){
    try{ await secApp.delete(); }catch(e2){}
    throw e;
  }
}
/* تعيين كلمة مرور جديدة يدويًا (بديل فوري لا يعتمد على وصول بريد إلكتروني —
   مفيد عند تعذّر تسليم رسائل Firebase لبعض مزوّدي البريد مثل Hotmail/Outlook).
   يُنشئ حساب دخول جديد مباشرة بكلمة المرور المحددة؛ إن كان هناك حساب قديم بنفس البريد
   يجب حذفه أولًا يدويًا من Firebase Console قبل إعادة المحاولة. */
function openManualPasswordReset(record, kind){
  const targetEmail = kind==='user'
    ? (record.authEmail || usernameToEmail(record.username))
    : (record.authEmail || record.email || identifierToFamilyEmail(record.identifier));
  const box = document.getElementById('modalBox');
  box.innerHTML =
    '<div class="modal-head"><h3>تعيين كلمة مرور جديدة يدويًا</h3><button class="close-x" onclick="closeModal()">&times;</button></div>'+
    '<p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; line-height:1.8;">بديل فوري لا يعتمد على البريد الإلكتروني — مفيد عند تعذّر وصول رسائل إعادة التعيين (كما يحدث أحيانًا مع Hotmail/Outlook). سيُنشأ حساب دخول بالبريد <b>'+esc(targetEmail)+'</b> وكلمة المرور التي تحددها أدناه.</p>'+
    '<div class="login-error" id="mprErr" style="display:none;"></div>'+
    '<div class="field"><label>كلمة المرور الجديدة *</label><input id="mpr_pass" type="text" placeholder="8 أحرف على الأقل"></div>'+
    '<div class="modal-actions"><button class="btn btn-primary" id="mprSubmit">تعيين الآن</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>';
  document.getElementById('modalBackdrop').style.display='flex';
  document.getElementById('mprSubmit').onclick = async ()=>{
    const errBox = document.getElementById('mprErr'); errBox.style.display='none';
    const pass = document.getElementById('mpr_pass').value;
    if(!pass || pass.length<8){ errBox.textContent='كلمة المرور يجب ألا تقل عن 8 أحرف'; errBox.style.display='block'; return; }
    const btn=document.getElementById('mprSubmit'); btn.disabled=true; btn.textContent='جارٍ التنفيذ...';
    try{
      let newUid;
      try{
        const r = await callFn('adminSetPassword', {email:targetEmail, password:pass});
        newUid = r.uid;
      }catch(fe){
        if(fe && fe.code==='functions/not-found'){
          const role = kind==='user' ? (record.role||'employee') : 'family';
          const r2 = await callFn('adminCreateUser', {email:targetEmail, password:pass, kind: kind==='user'?'staff':'family', role, name: record.name||record.guardianName||''});
          newUid = r2.uid;
        } else if(fe && fe.code==='functions/unavailable'){
          newUid = await createAuthUserSecondary(targetEmail, pass);
        } else { throw fe; }
      }
      record.authUid = newUid;
      if(kind==='user'){
        record.authEmail = targetEmail; if(record.password) delete record.password;
        await saveKey('users'); await addAudit('تعيين كلمة مرور يدويًا','المستخدمون', record.name);
      } else {
        record.authEmail = targetEmail; if(record.password) delete record.password;
        await saveKey('families'); await addAudit('تعيين كلمة مرور يدويًا','الأسر المستفيدة', record.guardianName);
      }
      closeModal();
      toast('تم تعيين كلمة المرور بنجاح — أبلغ المستخدم بها ليسجّل دخوله مباشرة','ok');
    }catch(e){
      console.error(e);
      btn.disabled=false; btn.textContent='تعيين الآن';
      if(e && e.code==='auth/email-already-in-use'){
        errBox.innerHTML = 'يوجد حساب دخول سابق مرتبط بهذا البريد في نظام الدخول. لإكمال إعادة التعيين:<br>'+
          '1) افتح <a href="https://console.firebase.google.com/project/rawahem-system/authentication/users" target="_blank" style="color:var(--primary); text-decoration:underline;">Firebase Console ← Authentication ← Users</a><br>'+
          '2) ابحث عن البريد: <b>'+esc(targetEmail)+'</b> واحذف ذلك الحساب (⋮ ← Delete account)<br>'+
          '3) ارجع هنا واضغط "تعيين الآن" مرة أخرى';
      } else if(e && (e.code==='auth/weak-password' || e.code==='functions/invalid-argument')){
        errBox.textContent=(e.message && e.code.startsWith('functions')) ? e.message : 'كلمة المرور ضعيفة جدًا، اختر كلمة أقوى (8 أحرف فأكثر)';
      } else if(e && e.code==='functions/permission-denied'){
        errBox.textContent='لا تملك صلاحية المدير الموثّقة بعد. سجّل الخروج ثم الدخول مرة أخرى وجرّب';
      } else {
        errBox.textContent='تعذّر تنفيذ العملية، تحقق من الاتصال وحاول مجددًا';
      }
      errBox.style.display='block';
    }
  };
}

async function loadKey(name, seedFn){
  if(!firebaseReady){ DB[name] = seedFn(); return; }
  try{
    const docSnap = await db.collection('raham').doc(name).get();
    if(docSnap.exists && docSnap.data().value){
      DB[name] = JSON.parse(docSnap.data().value);
    } else {
      DB[name] = seedFn();
      await saveKey(name);
    }
  }catch(e){
    console.error('loadKey failed', name, e);
    DB[name] = seedFn();
  }
}
async function saveKey(name){
  if(!firebaseReady){ toast('لم يتم إعداد قاعدة البيانات بعد (راجع firebaseConfig)', 'err'); return; }
  try{
    await db.collection('raham').doc(name).set({ value: JSON.stringify(DB[name]) });
    return true;
  }catch(e){ toast('تعذر الاتصال بقاعدة البيانات', 'err'); console.error(e); }
}

function seedUsers(){
  /* لا كلمات مرور هنا — الحسابات تُنشأ من Firebase Authentication Console مباشرة،
     وتُربط تلقائيًا بهذه الملفات عند أول تسجيل دخول ناجح (مطابقة بالبريد/اسم المستخدم). */
  return [
    {id:'u1', username:'admin', email:'admin@rawahem.local', name:'مدير النظام', role:'admin', active:true},
    {id:'u2', username:'employee', email:'employee@rawahem.local', name:'موظف الجمعية', role:'employee', active:true},
    {id:'u3', username:'board', email:'board@rawahem.local', name:'عضو مجلس الإدارة', role:'board', active:true},
    {id:'u4', username:'auditor', email:'auditor@rawahem.local', name:'مراجع خارجي', role:'auditor', active:true},
  ];
}
function seedEmpty(){ return []; }
function seedDriveCfg(){ return {clientId:'', folderId:''}; }
function seedCategories(){ return ['عقود واتفاقيات','تقارير مالية','محاضر اجتماعات','مراسلات رسمية','ملفات موظفين','تراخيص وشهادات','أخرى']; }
function seedSettings(){ return {orgName:'جمعية رواحم', orgTag:'لرعاية الأسر والأيتام'}; }

async function loadAll(){
  await loadKey('users', seedUsers);
  await loadKey('documents', seedEmpty);
  await loadKey('orphans', seedEmpty);
  await loadKey('requests', seedEmpty);
  await loadKey('decisions', seedEmpty);
  await loadKey('audit', seedEmpty);
  await loadKey('driveconfig', seedDriveCfg);
  await loadKey('categories', seedCategories);
  await loadKey('settings', seedSettings);
  await loadKey('families', seedEmpty);
  await loadKey('appointments', seedEmpty);
  /* ترحيل: أي مستخدم قديم لا يملك بريدًا إلكترونيًا بعد يُعطى بريدًا داخليًا مؤقتًا تلقائيًا */
  let migrated = false;
  DB.users.forEach(u=>{ if(!u.email){ u.email = usernameToEmail(u.username); migrated = true; } });
  if(migrated) await saveKey('users');
}
function getCategories(){ return (DB.categories && DB.categories.length) ? DB.categories : seedCategories(); }

function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('ar-SA', {year:'numeric', month:'2-digit', day:'2-digit'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('ar-SA') + ' ' + d.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'}); }
function daysSince(iso){ if(!iso) return 0; return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
function esc(s){ if(s===undefined || s===null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function addAudit(action, entity, details){
  DB.audit.unshift({id:uid('a'), at:nowIso(), userName:currentUser?currentUser.name:'—', userRole:currentUser?currentUser.role:'—', action, entity, details:details||''});
  if(DB.audit.length>800) DB.audit = DB.audit.slice(0,800);
  await saveKey('audit');
}

/* ---------------- toast ---------------- */
function toast(msg, type){
  const host = document.getElementById('toastHost');
  const t = document.createElement('div');
  t.className = 'toast' + (type==='err'?' err':type==='ok'?' ok':'');
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300); }, 2600);
}

/* ---------------- auth (Firebase Authentication) ---------------- */
function findProfileByLogin(raw){
  const low = (raw||'').trim().toLowerCase();
  return DB.users.find(x => (x.username && x.username.toLowerCase()===low) || (x.email && x.email.toLowerCase()===low));
}
async function doLogin(){
  const uRaw = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display = 'none';
  if(!uRaw || !p){ errBox.textContent = 'يرجى إدخال اسم المستخدم/البريد وكلمة المرور'; errBox.style.display='block'; return; }
  if(!authReady){ errBox.textContent = 'تعذّر الاتصال بنظام تسجيل الدخول الآمن. حاول لاحقًا'; errBox.style.display='block'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'جارٍ التحقق...';
  try{
    const profileBefore = null; /* القراءة قبل تسجيل الدخول غير مسموحة — نشتق البريد من النص المكتوب فقط */
    const email = (uRaw.indexOf('@')>-1 ? uRaw.toLowerCase() : usernameToEmail(uRaw));
    let cred;
    try{
      cred = await auth.signInWithEmailAndPassword(email, p);
    }catch(authErr){
      /* حساب لم يُرحَّل بعد إلى Firebase Authentication (نظام قديم بكلمة مرور نصية) — نرحّله تلقائيًا الآن إذا تطابقت البيانات */
      const legacy = profileBefore && profileBefore.password===p ? profileBefore : null;
      if(legacy && legacy.active){
        cred = await auth.createUserWithEmailAndPassword(email, p);
        legacy.authUid = cred.user.uid;
        legacy.email = email;
        delete legacy.password;
        await saveKey('users');
      } else {
        throw authErr;
      }
    }
    const uidAuth = cred.user.uid;
    await loadAll(); /* بعد الدخول فقط يُسمح بقراءة البيانات */
    let profile = DB.users.find(x=>x.authUid===uidAuth);
    if(!profile){ profile = DB.users.find(x=>x.email && x.email.toLowerCase()===(cred.user.email||'').toLowerCase()) || DB.users.find(x=>x.authEmail && x.authEmail.toLowerCase()===(cred.user.email||'').toLowerCase()); if(profile){ profile.authUid=uidAuth; await saveKey('users'); } }
    if(!profile){
      profile = findProfileByLogin(uRaw);
      if(profile){ profile.authUid = uidAuth; if(profile.password) delete profile.password; await saveKey('users'); }
    }
    if(!profile){
      errBox.textContent = 'تم التحقق من الحساب، لكن لا يوجد ملف صلاحيات مرتبط به. تواصل مع مدير النظام';
      errBox.style.display = 'block';
      try{ await auth.signOut(); }catch(e){}
      return;
    }
    if(!profile.active){
      errBox.textContent = 'هذا الحساب موقوف. تواصل مع مدير النظام';
      errBox.style.display = 'block';
      try{ await auth.signOut(); }catch(e){}
      return;
    }
    currentUser = profile;
    await addAudit('تسجيل دخول', 'المستخدمون', profile.name);
    enterApp();
    if(profile.role==='admin') ensureAdminClaims();
  }catch(e){
    console.error(e);
    errBox.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    errBox.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'تسجيل الدخول';
  }
}
async function doLogout(){
  await addAudit('تسجيل خروج', 'المستخدمون', currentUser?currentUser.name:'');
  currentUser = null;
  try{ if(authReady) await auth.signOut(); }catch(e){}
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUser').value=''; document.getElementById('loginPass').value='';
}
async function forgotPassword(){
  const uRaw = (document.getElementById('loginUser').value || '').trim();
  if(!uRaw){ toast('اكتب اسم المستخدم أو البريد الإلكتروني أولاً في الحقل أعلاه', 'err'); return; }
  if(!authReady){ toast('تعذّر الاتصال بنظام تسجيل الدخول الآمن', 'err'); return; }
  const email = uRaw.indexOf('@')>-1 ? uRaw.toLowerCase() : usernameToEmail(uRaw);
  if(email.endsWith('@rawahem.local')){
    toast('هذا الحساب ليس له بريد إلكتروني حقيقي بعد. اطلب من مدير النظام تحديث بريدك من "المستخدمون"', 'err');
    return;
  }
  try{
    await auth.sendPasswordResetEmail(email);
    toast('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني', 'ok');
  }catch(e){
    console.error(e);
    toast('تعذر إرسال رابط إعادة التعيين. تحقق من صحة البريد الإلكتروني', 'err');
  }
}
function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userNameTop').textContent = currentUser.name;
  document.getElementById('userRoleTop').textContent = ROLE_LABEL[currentUser.role];
  document.getElementById('avatarLetter').textContent = currentUser.name.trim()[0] || 'م';
  document.getElementById('sidebarOrgName').textContent = (DB.settings.orgName||'رواحم') + ' | الأرشفة والحوكمة';
  document.getElementById('sidebarOrgTag').textContent = DB.settings.orgTag || 'رعاية الأيتام';
  buildNav();
  navigate('dashboard');
  updateNotifBell();
  const setBtn = document.getElementById('settingsBtnTop');
  if(setBtn) setBtn.style.display = currentUser.role==='admin' ? 'flex' : 'none';
}
function updateNotifBell(){
  const dot = document.getElementById('notifDot');
  if(!dot) return;
  const activeReq = (DB.requests||[]).filter(r=>r.status==='نشط');
  const overdue = activeReq.filter(r => daysSince(stageEnteredAt(r)) > OVERDUE_DAYS);
  dot.style.display = overdue.length ? 'block' : 'none';
}

/* ---------------- permissions ---------------- */
function can(action, mod){
  const r = currentUser.role;
  if(r==='auditor') return action==='view';
  if(r==='admin') return true;
  const map = {
    employee: {archive:['view','create','edit'], orphans:['view','create','edit'], requests:['view','create','act'], decisions:['view'], users:[], families:['view','create','edit']},
    board: {archive:['view'], orphans:['view'], requests:['view','act'], decisions:['view','create','edit'], users:[], families:['view']},
  };
  return (map[r] && map[r][mod] && map[r][mod].includes(action)) || false;
}

/* ---------------- generic table ---------------- */
function buildTable(columns, rows, actionsFn, emptyTitle, emptyDesc){
  if(!rows.length){
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.innerHTML = '<h4>'+esc(emptyTitle)+'</h4><p>'+esc(emptyDesc)+'</p>';
    return e;
  }
  const wrap = document.createElement('div');
  wrap.style.overflowX = 'auto';
  const t = document.createElement('table');
  const thead = document.createElement('tr');
  columns.forEach(c=>{ const th=document.createElement('th'); th.textContent=c.label; thead.appendChild(th); });
  if(actionsFn){ const th=document.createElement('th'); th.textContent=''; thead.appendChild(th); }
  t.appendChild(thead);
  rows.forEach(row=>{
    const tr = document.createElement('tr');
    columns.forEach(c=>{
      const td = document.createElement('td');
      if(c.html) td.innerHTML = c.render(row);
      else td.textContent = c.render ? c.render(row) : (row[c.key] ?? '—');
      tr.appendChild(td);
    });
    if(actionsFn){
      const td = document.createElement('td');
      const div = document.createElement('div'); div.className='row-actions';
      actionsFn(row).forEach(a=>{
        const b = document.createElement('button');
        b.className = 'btn btn-sm ' + (a.variant || 'btn-outline');
        b.textContent = a.label;
        b.onclick = a.onClick;
        div.appendChild(b);
      });
      td.appendChild(div);
      tr.appendChild(td);
    }
    t.appendChild(tr);
  });
  wrap.appendChild(t);
  return wrap;
}

/* ---------------- generic modal form ---------------- */
function openModal(title, fields, initial, onSubmit){
  const backdrop = document.getElementById('modalBackdrop');
  const box = document.getElementById('modalBox');
  initial = initial || {};
  let html = '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="close-x" onclick="closeModal()">&times;</button></div><div class="form-grid" id="modalFormGrid">';
  fields.forEach(f=>{
    const val = initial[f.key] !== undefined ? initial[f.key] : (f.default !== undefined ? f.default : '');
    const fullCls = f.full ? ' full' : '';
    html += '<div class="field '+fullCls+'">';
    html += '<label>'+esc(f.label)+(f.required?' *':'')+'</label>';
    if(f.type==='select'){
      html += '<select id="mf_'+f.key+'">';
      f.options.forEach(o=>{ html += '<option value="'+esc(o.value)+'" '+(String(val)===String(o.value)?'selected':'')+'>'+esc(o.label)+'</option>'; });
      html += '</select>';
    } else if(f.type==='textarea'){
      html += '<textarea id="mf_'+f.key+'" rows="3">'+esc(val)+'</textarea>';
    } else if(f.type==='checkbox'){
      html += '<div style="padding-top:8px;"><input type="checkbox" id="mf_'+f.key+'" '+(val?'checked':'')+' style="width:auto; margin-left:6px;"> <span style="font-size:13px; color:var(--ink-soft);">'+esc(f.checkLabel||'')+'</span></div>';
    } else if(f.type==='file'){
      html += '<input type="file" id="mf_'+f.key+'" accept="'+(f.accept||'*')+'">';
      if(val && val.fileName) html += '<div class="hint">الملف الحالي: '+esc(val.fileName)+'</div>';
      html += '<div class="hint">الحد الأقصى ~1.5MB للملف الواحد</div>';
    } else {
      html += '<input type="'+(f.type||'text')+'" id="mf_'+f.key+'" value="'+esc(val)+'">';
    }
    if(f.hint) html += '<div class="hint">'+esc(f.hint)+'</div>';
    html += '</div>';
  });
  html += '</div><div class="modal-actions"><button class="btn btn-primary" id="modalSubmitBtn">حفظ</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>';
  box.innerHTML = html;
  backdrop.style.display = 'flex';
  document.getElementById('modalSubmitBtn').onclick = async ()=>{
    const out = {};
    let ok = true;
    for(const f of fields){
      const elm = document.getElementById('mf_'+f.key);
      if(!elm) continue;
      if(f.type==='checkbox'){ out[f.key] = elm.checked; continue; }
      if(f.type==='file'){
        if(elm.files && elm.files[0]){
          const file = elm.files[0];
          if(file.size > 1.6*1024*1024){ toast('حجم الملف كبير جدًا (أقصى حد 1.5MB تقريبًا)', 'err'); ok=false; break; }
          const b64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
          out[f.key] = {fileName:file.name, fileData:b64};
        } else if(initial[f.key]){ out[f.key] = initial[f.key]; }
        continue;
      }
      const v = elm.value.trim();
      if(f.required && !v){ toast('يرجى تعبئة: '+f.label, 'err'); ok=false; break; }
      out[f.key] = v;
    }
    if(!ok) return;
    await onSubmit(out);
    closeModal();
  };
}
function closeModal(){ document.getElementById('modalBackdrop').style.display='none'; document.getElementById('modalBox').innerHTML=''; }

function confirmDialog(title, msg, onYes, dangerLabel){
  const backdrop = document.getElementById('modalBackdrop');
  const box = document.getElementById('modalBox');
  box.innerHTML = '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="close-x" onclick="closeModal()">&times;</button></div>'+
    '<p style="font-size:14px; color:var(--ink-soft); line-height:1.7;">'+esc(msg)+'</p>'+
    '<div class="modal-actions"><button class="btn btn-danger" id="confirmYesBtn">'+esc(dangerLabel||'تأكيد')+'</button><button class="btn btn-ghost" onclick="closeModal()">تراجع</button></div>';
  backdrop.style.display='flex';
  document.getElementById('confirmYesBtn').onclick = async ()=>{ await onYes(); closeModal(); };
}

const RETENTION = [{value:'1y',label:'سنة واحدة'},{value:'3y',label:'3 سنوات'},{value:'5y',label:'5 سنوات'},{value:'perm',label:'دائم'}];
const CONFID = [{value:'عام',label:'عام'},{value:'داخلي',label:'داخلي'},{value:'سري',label:'سري'}];

function renderArchive(c, filter, titleOverride, descOverride){
  filter = filter || {};
  const head = document.createElement('div'); head.className='page-head';
  head.innerHTML = '<div><h2>'+(titleOverride||'الأرشيف')+'</h2><div class="page-desc">'+(descOverride||'فهرسة موحّدة لمستندات الجمعية مع تصنيف السرية ومدة الاحتفاظ، لتقليل الأوراق المتناثرة وتسريع الاسترجاع.')+'</div></div>';
  const rightBtns = document.createElement('div');
  if(can('create','archive')){
    const b = document.createElement('button'); b.className='btn btn-primary'; b.textContent='+ إضافة مستند';

  c.appendChild(head);

  toolbar.innerHTML = '<input id="docSearch" placeholder="ابحث بعنوان المستند أو رقم المرجع..." style="min-width:220px;">'+
    (filter.category ? '' : '<select id="docCatFilter"><option value="">كل التصنيفات</option>'+getCategories().map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select>');
  c.appendChild(toolbar);

  const tableHost = document.createElement('div');
  c.appendChild(tableHost);

  function draw(){
    const q = document.getElementById('docSearch').value.trim();
    const catEl = document.getElementById('docCatFilter');
    const cat = filter.category || (catEl ? catEl.value : '');
    let rows = DB.documents.filter(d => !d.deleted && (!q || d.title.includes(q) || (d.refNumber||'').includes(q)) && (!cat || d.category===cat) && (!filter.docType || d.docType===filter.docType));
    rows = rows.sort((a,b)=> new Date(b.uploadedAt) - new Date(a.uploadedAt));
    tableHost.innerHTML='';
    tableHost.appendChild(buildTable(
      [
        {label:'العنوان', render:r=>r.title},
        {label:'الاتجاه', html:true, render:r=> r.docType==='صادر' ? '<span class="badge badge-danger">صادر</span>' : r.docType==='وارد' ? '<span class="badge badge-info">وارد</span>' : '<span class="tag-pill">داخلي</span>'},
        {label:'التصنيف', html:true, render:r=>'<span class="tag-pill">'+esc(r.category)+'</span>'},
        {label:'الرقم المرجعي', render:r=>r.refNumber||'—'},
        {label:'السرية', html:true, render:r=> badgeConfid(r.confidentiality)},
        {label:'مدة الاحتفاظ', render:r=> (RETENTION.find(x=>x.value===r.retention)||{}).label || '—'},
        {label:'تاريخ الرفع', render:r=>fmtDate(r.uploadedAt)},
        {label:'بواسطة', render:r=>r.uploadedByName},
        {label:'Drive', html:true, render:r=> !r.file || !r.file.fileData ? '—' : (r.driveFile ? '<span class="badge badge-success">مُزامَن</span>' : '<span class="badge badge-warn">بانتظار المزامنة</span>')},
      ],
      rows,
      (r)=>{
        const acts=[{label:'عرض', onClick:()=>openDocDetail(r.id)}];

        if(currentUser.role==='admin') acts.push({label:'نقل للمهملات', variant:'btn-danger', onClick:()=>confirmDialog('نقل للمهملات', 'سيُنقل "'+r.title+'" إلى المهملات، ويمكن استعادته لاحقًا.', async ()=>{
          r.deleted = true; r.deletedAt = nowIso(); await saveKey('documents'); await addAudit('نقل مستند للمهملات','الأرشفة', r.title); draw(); toast('تم النقل إلى المهملات','ok');
        })});
        return acts;
      },
      'لا توجد مستندات هنا بعد', 'ابدأ بإضافة أول مستند لتنظيم أرشيف الجمعية إلكترونيًا.'
    ));

function badgeConfid(v){
  const cls = v==='سري' ? 'badge-danger' : v==='داخلي' ? 'badge-warn' : 'badge-success';
  return '<span class="badge '+cls+'">'+esc(v)+'</span>';
}
function openDocModal(existing, presetCategory){
  openModal(existing?'تعديل مستند':'إضافة مستند جديد', [
    {key:'title', label:'عنوان المستند', required:true, full:true},
    {key:'category', label:'التصنيف', type:'select', options:getCategories().map(x=>({value:x,label:x})), required:true},
    {key:'docType', label:'اتجاه المستند', type:'select', options:[{value:'داخلي',label:'داخلي'},{value:'وارد',label:'وارد'},{value:'صادر',label:'صادر'}]},
    {key:'refNumber', label:'الرقم المرجعي'},
    {key:'docDate', label:'تاريخ المستند', type:'date'},
    {key:'confidentiality', label:'مستوى السرية', type:'select', options:CONFID, required:true},
    {key:'retention', label:'مدة الاحتفاظ', type:'select', options:RETENTION, required:true},
    {key:'notes', label:'ملاحظات', type:'textarea', full:true},
    {key:'file', label:'إرفاق ملف (اختياري)', type:'file', full:true},
  ], existing ? Object.assign({}, existing, {file:existing.file}) : {confidentiality:'داخلي', retention:'3y', docType:'داخلي', category:presetCategory||getCategories()[0]},
  async (vals)=>{
    let targetDoc;
    if(existing){
      const fileChanged = !!vals.file && (!existing.file || vals.file.fileName !== existing.file.fileName || vals.file.fileData !== existing.file.fileData);
      Object.assign(existing, vals, existing.file && !vals.file ? {file:existing.file} : {});
      if(vals.file) existing.file = vals.file;
      if(fileChanged) existing.driveFile = null;
      await saveKey('documents'); await addAudit('تعديل مستند','الأرشفة', existing.title);
      targetDoc = existing;
    } else {
      const doc = Object.assign({id:uid('doc'), uploadedByName:currentUser.name, uploadedAt:nowIso(), status:'نشط'}, vals);
      DB.documents.unshift(doc);
      await saveKey('documents'); await addAudit('إضافة مستند','الأرشفة', doc.title);
      targetDoc = doc;
    }
    toast('تم الحفظ بنجاح','ok');
    navigate('archive');
    if(targetDoc.file && targetDoc.file.fileData) await trySyncDocToDrive(targetDoc);
  });
}
function openDocDetail(id){
  const d = DB.documents.find(x=>x.id===id); if(!d) return;
  const box = document.getElementById('modalBox');
  const backdrop = document.getElementById('modalBackdrop');
  box.innerHTML = '<div class="modal-head"><h3>'+esc(d.title)+'</h3><button class="close-x" onclick="closeModal()">&times;</button></div>'+

  fam.notifications.unshift({id:uid('ntf'), text, at:nowIso(), read:false});

/* =========================================================
   REQUESTS / APPROVAL WORKFLOW — سير الموافقات (منع التكدس)
   ========================================================= */
const REQ_TYPES = ['صرف مالي','كفالة يتيم جديدة','توظيف / تعاقد','شراء / مشتريات','أخرى'];

function buildStages(requiresBoard){
  const st = [
    {name:'تقديم الطلب', ownerRole:'submitter'},
    {name:'مراجعة الموظف المختص', ownerRole:'employee'},
    {name:'اعتماد الإدارة', ownerRole:'admin'},
  ];
  if(requiresBoard) st.push({name:'اعتماد مجلس الإدارة', ownerRole:'board'});
  st.push({name:'مكتمل', ownerRole:'done'});
  return st;
}
function currentStage(r){ return r.stages[r.currentStageIndex]; }
function stageOwnerRole(r){ return currentStage(r).ownerRole; }
function stageEnteredAt(r){
  const h = r.history.filter(x=>x.stageIndex===r.currentStageIndex);
  return h.length ? h[h.length-1].at : r.createdAt;
}

function renderRequests(c){
  const head = document.createElement('div'); head.className='page-head';
  head.innerHTML = '<div><h2>سير الموافقات</h2><div class="page-desc">كل طلب له مسؤول واحد فقط في كل مرحلة، وتظهر تنبيهات فورية عند تجاوز مدة الانتظار — لمنع تكدس المعاملات في أروقة العمل.</div></div>';
  const rightBtns = document.createElement('div');
  if(can('create','requests')){
    const b = document.createElement('button'); b.className='btn btn-primary'; b.textContent='+ طلب جديد';
    b.onclick = ()=> openNewRequestModal();
    rightBtns.appendChild(b);
  }
  head.appendChild(rightBtns);
  c.appendChild(head);

  const cols = {};
  const allStagesSeen = [];
  buildStages(false).forEach(s=>allStagesSeen.push(s.name));
  buildStages(true).forEach(s=>{ if(!allStagesSeen.includes(s.name)) allStagesSeen.push(s.name); });

  const kanban = document.createElement('div'); kanban.className='kanban';
  const groups = {};
  allStagesSeen.forEach(n=>groups[n]=[]);
  groups['مرفوض']=[];
  DB.requests.forEach(r=>{
    if(r.status==='مرفوض'){ groups['مرفوض'].push(r); return; }
    const s = currentStage(r).name;
    if(!groups[s]) groups[s]=[];
    groups[s].push(r);
  });
  Object.keys(groups).forEach(stageName=>{
    const items = groups[stageName];
    const col = document.createElement('div'); col.className='kcol';
    col.innerHTML = '<div class="kcol-head"><b>'+esc(stageName)+'</b><span class="kcount">'+items.length+'</span></div>';
    if(!items.length){
      const e = document.createElement('div'); e.style.cssText='font-size:12px; color:var(--ink-soft); text-align:center; padding:14px 4px;'; e.textContent='لا توجد طلبات';
      col.appendChild(e);
    } else {
      items.sort((a,b)=> new Date(stageEnteredAt(a)) - new Date(stageEnteredAt(b))).forEach(r=>{
        const d = daysSince(stageEnteredAt(r));
        const card = document.createElement('div'); card.className='kcard';
        card.innerHTML = '<div class="kcard-title">'+(r.source==='beneficiary'?'👪 ':'')+esc(r.subject)+'</div><div class="kcard-meta"><span>'+esc(r.type)+'</span>'+(d>OVERDUE_DAYS && r.status==='نشط' ? '<span class="badge badge-danger">'+d+' يوم</span>' : '<span class="tag-pill">'+d+' يوم</span>')+'</div>';
        card.onclick = ()=> openRequestDetail(r.id);
        col.appendChild(card);
      });
    }
    kanban.appendChild(col);
  });
  c.appendChild(kanban);
}
function openNewRequestModal(){
  openModal('إنشاء طلب جديد', [
    {key:'type', label:'نوع الطلب', type:'select', options:REQ_TYPES.map(x=>({value:x,label:x})), required:true},
    {key:'subject', label:'موضوع الطلب', required:true, full:true},
    {key:'description', label:'التفاصيل', type:'textarea', full:true},
    {key:'requiresBoard', label:'', type:'checkbox', checkLabel:'يتطلب اعتماد مجلس الإدارة (للطلبات عالية الأثر)', full:true},
  ], {}, async (vals)=>{
    const stages = buildStages(!!vals.requiresBoard);
    const r = {
      id:uid('req'), type:vals.type, subject:vals.subject, description:vals.description||'',
      requestedByName:currentUser.name, requestedByRole:currentUser.role,
      requiresBoard: !!vals.requiresBoard, stages, currentStageIndex:1, status:'نشط', createdAt:nowIso(),
      history:[{stageIndex:0, stageName:stages[0].name, action:'تقديم', byName:currentUser.name, byRole:currentUser.role, at:nowIso(), note:''}]
    };
    r.history.push({stageIndex:1, stageName:stages[1].name, action:'دخول المرحلة', byName:'النظام', byRole:'system', at:nowIso(), note:''});
    DB.requests.unshift(r);
    await saveKey('requests'); await addAudit('إنشاء طلب','سير الموافقات', r.subject);
    toast('تم إنشاء الطلب','ok'); navigate('requests');
  });
}
function openRequestDetail(id){
  const r = DB.requests.find(x=>x.id===id); if(!r) return;
  const box = document.getElementById('modalBox');
  const isAdmin = currentUser.role==='admin';
  const canAct = r.status==='نشط' && stageOwnerRole(r)!=='done' && (stageOwnerRole(r)===currentUser.role || isAdmin);
  let hist = r.history.map(h=>'<div style="padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px;"><b>'+esc(h.stageName)+'</b> — '+esc(h.action)+' بواسطة '+esc(h.byName)+' <span style="color:var(--ink-soft);">('+fmtDateTime(h.at)+')</span>'+(h.note?'<br><span style="color:var(--ink-soft);">ملاحظة: '+esc(h.note)+'</span>':'')+'</div>').join('');
  box.innerHTML = '<div class="modal-head"><h3>'+esc(r.subject)+'</h3><button class="close-x" onclick="closeModal()">&times;</button></div>'+
    '<p style="font-size:13px; color:var(--ink-soft); line-height:1.9;">النوع: <b style="color:var(--ink)">'+esc(r.type)+'</b><br>مقدَّم من: <b style="color:var(--ink)">'+esc(r.requestedByName)+'</b>'+(r.source==='beneficiary'?' <span class="tag-pill">مقدَّم من أسرة مستفيدة عبر البوابة</span>':'')+'<br>الحالة: '+
    (r.status==='نشط' ? '<span class="badge badge-info">قيد الإجراء — '+esc(currentStage(r).name)+'</span>' : r.status==='معتمد' ? '<span class="badge badge-success">معتمد نهائيًا</span>' : '<span class="badge badge-danger">مرفوض</span>')+
    '</p>'+
    (r.description ? '<p style="font-size:13px; margin-top:8px;">'+esc(r.description)+'</p>' : '')+
    '<h4 style="font-size:13.5px; margin-top:14px;">سجل الإجراءات</h4><div style="max-height:160px; overflow-y:auto;">'+hist+'</div>'+
    (canAct ? '<div class="field" style="margin-top:12px;"><label>ملاحظة (اختياري)</label><textarea id="reqActionNote" rows="2"></textarea></div>'+
      '<div class="modal-actions">'+
      (stageOwnerRole(r)===currentUser.role ? '<button class="btn btn-primary" onclick="actOnRequest(\''+r.id+'\',\'approve\')">اعتماد ونقل للمرحلة التالية</button>' : '')+
      '<button class="btn btn-danger" onclick="actOnRequest(\''+r.id+'\',\'reject\')">رفض الطلب</button>'+
      (r.currentStageIndex>1 ? '<button class="btn btn-outline" onclick="actOnRequest(\''+r.id+'\',\'return\')">إرجاع للمرحلة السابقة</button>' : '')+
      '</div>'
      : '')+
    (isAdmin ? '<div class="modal-actions" style="border-top:1px solid var(--border); margin-top:4px; padding-top:12px;">'+
      '<button class="btn btn-ghost" style="color:var(--danger);" onclick="deleteRequestPermanently(\''+r.id+'\')">🗑 حذف الطلب نهائيًا من النظام</button>'+
      '</div>' : '');
  document.getElementById('modalBackdrop').style.display='flex';
}
async function actOnRequest(id, action){
  const r = DB.requests.find(x=>x.id===id); if(!r) return;
  const noteEl = document.getElementById('reqActionNote');
  const note = noteEl ? noteEl.value.trim() : '';
  if(action==='approve'){
    r.currentStageIndex++;
    const stg = r.stages[r.currentStageIndex];
    r.history.push({stageIndex:r.currentStageIndex, stageName:stg.name, action:'اعتماد', byName:currentUser.name, byRole:currentUser.role, at:nowIso(), note});
    if(stg.ownerRole==='done') r.status='معتمد';
  } else if(action==='reject'){
    r.status='مرفوض';
    r.history.push({stageIndex:r.currentStageIndex, stageName:currentStage(r).name, action:'رفض', byName:currentUser.name, byRole:currentUser.role, at:nowIso(), note});
  } else if(action==='return'){
    r.currentStageIndex--;
    r.history.push({stageIndex:r.currentStageIndex, stageName:currentStage(r).name, action:'إرجاع للمراجعة', byName:currentUser.name, byRole:currentUser.role, at:nowIso(), note});
  }
  await saveKey('requests');
  await addAudit('إجراء على طلب ('+action+')','سير الموافقات', r.subject);
  if(r.familyId){
    const msg = action==='approve' ? (r.status==='معتمد' ? 'تم اعتماد طلبك نهائيًا: '+r.subject : 'تم نقل طلبك لمرحلة جديدة: '+r.subject)
      : action==='reject' ? 'تم رفض طلبك: '+r.subject
      : 'تمت إعادة طلبك للمراجعة: '+r.subject;
    await notifyFamily(r.familyId, msg);
  }
  closeModal(); navigate('requests'); toast('تم تنفيذ الإجراء','ok');
}
function deleteRequestPermanently(id){
  const r = DB.requests.find(x=>x.id===id); if(!r) return;
  if(currentUser.role!=='admin'){ toast('هذا الإجراء لمدير النظام فقط','err'); return; }
  confirmDialog('حذف الطلب نهائيًا', 'سيُحذف طلب "'+r.subject+'" نهائيًا من النظام ولن يمكن التراجع عن ذلك. هل أنت متأكد؟', async ()=>{
    DB.requests = DB.requests.filter(x=>x.id!==id);
    await saveKey('requests');
    await addAudit('حذف طلب نهائيًا','سير الموافقات', r.subject);
    if(r.familyId){ await notifyFamily(r.familyId, 'تم حذف طلبك من النظام: '+r.subject); }
    closeModal(); navigate('requests'); toast('تم حذف الطلب نهائيًا','ok');
  }, 'حذف نهائي');
}

function renderDecisions(c){

  head.innerHTML = '<div><h2>سجل القرارات ومحاضر الاجتماعات</h2><div class="page-desc">سجل رسمي مرقم لقرارات مجلس الإدارة، متوافق مع مبدأ التوثيق والرقابة الإدارية.</div></div>';
  const rightBtns = document.createElement('div'); rightBtns.style.display='flex'; rightBtns.style.gap='8px';
  if(can('create','decisions')){
    const b = document.createElement('button'); b.className='btn btn-primary'; b.textContent='+ تسجيل قرار';
    b.onclick = ()=> openDecisionModal();
    rightBtns.appendChild(b);
  }
  const pb = document.createElement('button'); pb.className='btn btn-outline'; pb.textContent='طباعة السجل'; pb.onclick=()=>window.print();
  rightBtns.appendChild(pb);
  head.appendChild(rightBtns);
  c.appendChild(head);

  const rows = [...DB.decisions].sort((a,b)=> new Date(b.meetingDate)-new Date(a.meetingDate));
  c.appendChild(buildTable(
    [
      {label:'رقم القرار', render:r=>r.decisionNumber||'—'},
      {label:'تاريخ الاجتماع', render:r=>fmtDate(r.meetingDate)},
      {label:'نوع الاجتماع', render:r=>r.meetingType},
      {label:'الموضوع', render:r=>r.subject},
      {label:'نتيجة التصويت', render:r=>r.votingResult},
      {label:'سجّله', render:r=>r.recordedByName},
    ],
    rows,
    (r)=>{
      const acts=[{label:'عرض', onClick:()=>openDecisionDetail(r.id)}];
      if(can('edit','decisions')) acts.push({label:'تعديل', onClick:()=>openDecisionModal(r)});
      if(currentUser.role==='admin') acts.push({label:'حذف', variant:'btn-danger', onClick:()=>confirmDialog('حذف القرار', 'سيتم حذف القرار رقم "'+(r.decisionNumber||'')+'" نهائيًا.', async ()=>{
        DB.decisions = DB.decisions.filter(x=>x.id!==r.id); await saveKey('decisions'); await addAudit('حذف قرار','سجل القرارات', r.subject); navigate('decisions'); toast('تم الحذف','ok');
      })});

function openUserModal(existing){
  const fields = existing ? [
    {key:'name', label:'الاسم الكامل', required:true, full:true},
    {key:'username', label:'اسم المستخدم', required:true},
    {key:'email', label:'البريد الإلكتروني', required:false, hint:'أدخل بريدًا حقيقيًا ليتمكن هذا المستخدم من استخدام "نسيت كلمة المرور" بنفسه'},
    {key:'role', label:'الدور', type:'select', options:Object.keys(ROLE_LABEL).map(k=>({value:k,label:ROLE_LABEL[k]})), required:true},
  ] : [
    {key:'name', label:'الاسم الكامل', required:true, full:true},
    {key:'username', label:'اسم المستخدم', required:true},
    {key:'email', label:'البريد الإلكتروني', required:true, hint:'يُستخدم لتسجيل الدخول ولإعادة تعيين كلمة المرور مستقبلًا'},
    {key:'password', label:'كلمة المرور المبدئية', required:true, hint:'8 أحرف على الأقل — أبلغ المستخدم بها ليغيّرها لاحقًا'},
    {key:'role', label:'الدور', type:'select', options:Object.keys(ROLE_LABEL).map(k=>({value:k,label:ROLE_LABEL[k]})), required:true},
  ];
  openModal(existing?'تعديل مستخدم':'إضافة مستخدم جديد', fields, existing || {role:'employee'},
  async (vals)=>{
    if(DB.users.some(u=>u.username===vals.username && (!existing || u.id!==existing.id))){ toast('اسم المستخدم مستخدم مسبقًا','err'); return; }
    if(existing){
      const roleChanged = existing.role!==vals.role;
      existing.name=vals.name; existing.username=vals.username; existing.role=vals.role;
      if(roleChanged && existing.authUid){ try{ await callFn('adminSetRole', {uid:existing.authUid, role:vals.role}); }catch(e){ console.warn('setRole', e); toast('تم الحفظ لكن تعذّر تحديث الصلاحية الموثّقة','err'); } }
      if(vals.email) existing.email = vals.email;
      await saveKey('users'); await addAudit('تعديل مستخدم','المستخدمون', existing.name);
      toast('تم الحفظ بنجاح','ok'); navigate('users');
    } else {
      if(DB.users.some(u=>u.email===vals.email)){ toast('هذا البريد الإلكتروني مستخدم مسبقًا','err'); return; }
      let newUid;
      try{
        try{
          const r = await callFn('adminCreateUser', {email:vals.email, password:vals.password, kind:'staff', role:vals.role, name:vals.name});
          newUid = r.uid;
        }catch(fe){
          if(fe && fe.code==='functions/unavailable') newUid = await createAuthUserSecondary(vals.email, vals.password);
          else throw fe;
        }
      }catch(e){
        console.error(e);
        let msg = 'تعذر إنشاء حساب الدخول الآمن لهذا المستخدم';
        if(e && (e.code==='auth/email-already-in-use' || e.code==='functions/already-exists')) msg = 'هذا البريد الإلكتروني مستخدم مسبقًا في نظام الدخول';
        else if(e && (e.code==='auth/weak-password' || e.code==='functions/invalid-argument')) msg = 'كلمة المرور ضعيفة (8 أحرف على الأقل) أو البريد غير صالح';
        else if(e && e.code==='functions/permission-denied') msg = 'لا تملك صلاحية المدير الموثّقة بعد. سجّل الخروج ثم الدخول وجرّب';
        else if(e && e.code==='auth/invalid-email') msg = 'صيغة البريد الإلكتروني غير صحيحة';
        toast(msg,'err'); return;
      }
      const u = {id:uid('u'), name:vals.name, username:vals.username, email:vals.email, role:vals.role, active:true, authUid:newUid};
      DB.users.push(u); await saveKey('users'); await addAudit('إضافة مستخدم','المستخدمون', u.name);
      toast('تم الحفظ بنجاح','ok'); navigate('users');
    }
  });
}

/* =========================================================
   GOOGLE DRIVE SYNC — مزامنة تلقائية لمرفقات الأرشيف
   ========================================================= */
let driveAccessToken = null;
let driveTokenClient = null;
let driveConnectedEmail = '';

function driveReady(){ return !!(DB.driveconfig && DB.driveconfig.clientId && DB.driveconfig.folderId); }

function initDriveTokenClient(){
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){ toast('مكتبة Google لم تُحمَّل بعد، أعد المحاولة بعد لحظات','err'); return null; }
  if(driveTokenClient) return driveTokenClient;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DB.driveconfig.clientId,
    scope: 'https://www.googleapis.com/auth/drive.file',
    callback: async (resp)=>{
      if(resp.error){ toast('تعذّر الربط مع Google Drive: '+resp.error, 'err'); return; }
      driveAccessToken = resp.access_token;
      toast('تم الربط مع Google Drive بنجاح','ok');
      await addAudit('ربط Google Drive','مزامنة Drive', currentUser.name);
      navigate('drivesync');
    }
  });
  return driveTokenClient;
}
function connectDrive(){
  if(!driveReady()){ toast('يجب على مدير النظام ضبط إعدادات Drive أولًا','err'); return; }
  const tc = initDriveTokenClient();
  if(tc) tc.requestAccessToken({prompt: driveAccessToken ? '' : 'consent'});
}
function disconnectDrive(){
  if(driveAccessToken && window.google) { try{ google.accounts.oauth2.revoke(driveAccessToken, ()=>{}); }catch(e){} }
  driveAccessToken = null;
  navigate('drivesync');
  toast('تم فصل الاتصال بـ Google Drive','ok');
}

function dataUrlToBlob(dataUrl){
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

async function uploadToDrive(fileName, dataUrl, existingFileId){
  if(!driveAccessToken || !driveReady()) return null;
  try{
    const blob = dataUrlToBlob(dataUrl);
    const metadata = existingFileId ? {name:fileName} : {name:fileName, parents:[DB.driveconfig.folderId]};
    const boundary = 'raham_boundary_' + Date.now();
    const metaPart = '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n';
    const filePartHeader = '--'+boundary+'\r\nContent-Type: '+blob.type+'\r\n\r\n';
    const closing = '\r\n--'+boundary+'--';
    const bodyBlob = new Blob([metaPart, filePartHeader, blob, closing]);
    const url = existingFileId
      ? 'https://www.googleapis.com/upload/drive/v3/files/'+existingFileId+'?uploadType=multipart'
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink';
    const res = await fetch(url, {
      method: existingFileId ? 'PATCH' : 'POST',
      headers: {'Authorization':'Bearer '+driveAccessToken, 'Content-Type':'multipart/related; boundary='+boundary},
      body: bodyBlob
    });
    if(!res.ok){ const t = await res.text(); console.error('Drive upload failed', t); toast('تعذّر رفع الملف إلى Drive (سيبقى محفوظًا داخل النظام فقط)','err'); return null; }
    const json = await res.json();
    if(!json.webViewLink){
      const info = await fetch('https://www.googleapis.com/drive/v3/files/'+json.id+'?fields=id,webViewLink', {headers:{'Authorization':'Bearer '+driveAccessToken}});
      const infoJson = await info.json();
      return {id: json.id || infoJson.id, link: infoJson.webViewLink};
    }
    return {id: json.id, link: json.webViewLink};
  }catch(e){
    console.error(e); toast('تعذّر الاتصال بـ Google Drive أثناء الرفع','err'); return null;
  }
}

async function trySyncDocToDrive(doc){
  if(!doc.file || !doc.file.fileData) return;
  if(!driveAccessToken){ return; } // user not connected this session — stays local-only until they connect
  const result = await uploadToDrive(doc.file.fileName, doc.file.fileData, doc.driveFile ? doc.driveFile.id : null);
  if(result){
    doc.driveFile = result;
    await saveKey('documents');
    await addAudit('مزامنة مستند مع Drive','الأرشفة', doc.title);
  }
}

function renderDriveSync(c){
  const head = document.createElement('div'); head.className='page-head';
  head.innerHTML = '<div><h2>مزامنة Google Drive</h2><div class="page-desc">عند الاتصال، تُرفع مرفقات المستندات الجديدة تلقائيًا إلى مجلد الجمعية المشترك على Google Drive.</div></div>';
  c.appendChild(head);

  const status = document.createElement('div');
  status.className = 'drive-status' + (driveAccessToken ? ' connected' : '');
  status.innerHTML = '<span class="drive-dot"></span><div style="flex:1; font-size:13.5px;">'+
    (driveAccessToken ? '<b>متصل بحساب Google Drive لهذه الجلسة</b><div class="hint">سيتم رفع أي مستند جديد بمرفق تلقائيًا</div>' :
    '<b>غير متصل حاليًا</b><div class="hint">اضغط "ربط الحساب" وسجّل دخول Google بحساب لديه صلاحية الكتابة على مجلد الجمعية</div>')+
    '</div>';
  c.appendChild(status);

  const btnRow = document.createElement('div'); btnRow.style.cssText='display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;';
  if(!driveReady()){
    btnRow.innerHTML = '<span class="badge badge-warn">إعدادات المزامنة غير مكتملة — راجع مدير النظام</span>';
  } else if(driveAccessToken){
    const b = document.createElement('button'); b.className='btn btn-danger'; b.textContent='فصل الاتصال'; b.onclick=disconnectDrive;
    btnRow.appendChild(b);
  } else {
    const b = document.createElement('button'); b.className='btn btn-primary'; b.textContent='ربط حسابي مع Google Drive'; b.onclick=connectDrive;
    btnRow.appendChild(b);
  }
  c.appendChild(btnRow);

  // sync status of existing docs with attachments
  const withFiles = DB.documents.filter(d=>d.file && d.file.fileData);
  const synced = withFiles.filter(d=>d.driveFile);
  const pending = withFiles.filter(d=>!d.driveFile);
  const stats = document.createElement('div'); stats.className='stat-grid';
  stats.innerHTML = statCard(withFiles.length,'مستند بمرفق','') + statCard(synced.length,'تمت مزامنته مع Drive','') + statCard(pending.length,'بانتظار المزامنة','accent');
  c.appendChild(stats);

  if(driveAccessToken && pending.length){
    const syncAllBtn = document.createElement('button'); syncAllBtn.className='btn btn-outline'; syncAllBtn.textContent='مزامنة كل المستندات المعلّقة الآن ('+pending.length+')';
    syncAllBtn.onclick = async ()=>{
      syncAllBtn.disabled = true; syncAllBtn.textContent='جارٍ المزامنة...';
      for(const d of pending){ await trySyncDocToDrive(d); }
      toast('تمت مزامنة المستندات المعلّقة','ok'); navigate('drivesync');
    };
    c.appendChild(syncAllBtn);
  }

  if(currentUser.role==='admin'){
    const panel = document.createElement('div'); panel.className='panel'; panel.style.marginTop='22px';
    panel.innerHTML = '<div class="panel-head"><h3>إعدادات الربط (لمدير النظام)</h3></div>';
    const grid = document.createElement('div'); grid.className='form-grid';
    grid.innerHTML =
      '<div class="field full"><label>Google Client ID</label><input id="cfgClientId" value="'+esc(DB.driveconfig.clientId||'')+'" placeholder="xxxxxxxxxx.apps.googleusercontent.com"></div>'+
      '<div class="field full"><label>معرّف مجلد Drive المشترك (Folder ID)</label><input id="cfgFolderId" value="'+esc(DB.driveconfig.folderId||'')+'" placeholder="من رابط المجلد في Drive"><div class="hint">يظهر في رابط المجلد بعد folders/ — مثال: drive.google.com/drive/folders/<b>هذا_الجزء</b></div></div>';
    panel.appendChild(grid);
    const saveBtn = document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.style.marginTop='12px';
    saveBtn.textContent='حفظ الإعدادات';
    saveBtn.onclick = async ()=>{
      DB.driveconfig.clientId = document.getElementById('cfgClientId').value.trim();
      DB.driveconfig.folderId = document.getElementById('cfgFolderId').value.trim();
      await saveKey('driveconfig'); await addAudit('تحديث إعدادات Drive','مزامنة Drive','');
      driveTokenClient = null; driveAccessToken = null;
      toast('تم حفظ الإعدادات، يرجى إعادة الربط','ok'); navigate('drivesync');
    };
    panel.appendChild(saveBtn);
    c.appendChild(panel);
  }
}

/* ---------------- boot ---------------- */
(async function boot(){
  if(!firebaseReady || firebaseConfig.apiKey.indexOf('PASTE_') === 0){
    document.getElementById('setupWarning').style.display = 'block';
  }
  /* Firebase Authentication يحتفظ بجلسة الدخول تلقائيًا (localStorage) — عند إعادة فتح الصفحة نعيد الدخول تلقائيًا لنفس المستخدم */
  if(authReady){
    auth.onAuthStateChanged(async (user)=>{
      if(user && !currentUser){
        await loadAll();
        let profile = DB.users.find(x=>x.authUid===user.uid) || DB.users.find(x=>x.email && x.email.toLowerCase()===(user.email||'').toLowerCase());
        if(profile && profile.active){
          currentUser = profile;
          enterApp();
        } else if(profile && !profile.active){
          try{ await auth.signOut(); }catch(e){}
        }
      }
    });
  }
})();
</script>
