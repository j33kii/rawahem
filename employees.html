<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>بوابة الموظفين | جمعية رواحم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --ink:#1C2624; --ink-soft:#4E5B63;
  --primary:#0E4D3B; --primary-dark:#0A3A2C; --primary-soft:#E7EFEA;
  --accent:#8B6B56; --accent-soft:#EFE7DD;
  --border:#E3DDD1;
  --danger:#B4483A; --danger-soft:#F7E7E3;
  --warn:#C9862B; --warn-soft:#F8ECD9;
  --success:#3F7D5C; --success-soft:#E7F1EA;
  --info:#3B6E8F; --info-soft:#E6EEF2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'IBM Plex Sans Arabic',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; direction:rtl;}
button,input,select,textarea{font-family:inherit; font-size:15px;}
h1,h2,h3,h4{margin:0; font-weight:800;}
p{margin:0;}
.hidden{display:none !important;}

#loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 15% 20%, rgba(31,75,67,0.08), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(200,155,60,0.10), transparent 40%), var(--bg); padding:20px;}
.login-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:38px 30px; width:100%; max-width:380px; box-shadow:0 18px 40px -20px rgba(31,75,67,0.35);}
.brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.brand-mark{width:46px; height:46px; border-radius:12px; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:4px;}
.brand-title{font-size:19px; font-weight:800; color:var(--primary-dark); line-height:1.3;}
.brand-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13.5px; font-weight:700; margin-bottom:6px; color:var(--ink);}
.field input, .field select, .field textarea{width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px; background:#fff; color:var(--ink); outline:none; transition:border-color .15s;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.btn{border:none; border-radius:10px; padding:11px 18px; font-weight:700; cursor:pointer; font-size:14.5px; transition:filter .15s, transform .05s; display:inline-flex; align-items:center; gap:6px;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-accent{background:var(--accent); color:#2b2210;}
.btn-outline{background:transparent; color:var(--primary); border:1.5px solid var(--primary);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-ghost{background:transparent; color:var(--ink-soft);}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:8px;}
.btn-block{width:100%; justify-content:center;}
.login-error{background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:14px; font-weight:700; display:none;}
.demo-box{margin-top:18px; padding:12px 14px; background:var(--primary-soft); border-radius:10px; font-size:12.5px; color:var(--primary-dark); line-height:1.9;}
.demo-box b{font-weight:800;}

#app{display:none; min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{width:236px; background:var(--primary-dark); color:#EAF0EE; flex-shrink:0; display:flex; flex-direction:column; position:fixed; top:0; bottom:0; right:0; z-index:40; transition:transform .2s;}
.sidebar-head{padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-title{font-size:16px; font-weight:800; color:#fff;}
.sidebar-sub{font-size:11.5px; color:#B9CBC4; margin-top:3px;}
.nav{padding:12px 10px; flex:1; overflow-y:auto;}
.nav-item{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px; color:#CFDEDA; cursor:pointer; font-size:14.5px; font-weight:600; margin-bottom:3px; border-right:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{background:rgba(255,255,255,0.1); color:#fff; border-right-color:var(--accent);}
.nav-icon{width:19px; height:19px; flex-shrink:0;}
.sidebar-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,0.1); font-size:12px; color:#9FB4AE;}
.main{flex:1; margin-right:236px; min-height:100vh; display:flex; flex-direction:column;}
.topbar{background:var(--surface); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20;}
.topbar-title{font-size:18px; font-weight:800;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.user-chip{display:flex; align-items:center; gap:9px; padding:6px 6px 6px 12px; border-radius:30px; background:var(--bg); border:1px solid var(--border);}
.user-avatar{width:30px; height:30px; border-radius:50%; background:var(--accent); color:#2b2210; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.user-meta{font-size:12.5px; line-height:1.3;}
.user-meta b{display:block; font-size:13.5px;}
.hamburger{display:none; background:none; border:none; cursor:pointer; padding:4px;}
.content{padding:22px 24px 60px; max-width:1180px; width:100%; margin:0 auto;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:35; display:none;}

.page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.page-head h2{font-size:21px;}
.page-desc{color:var(--ink-soft); font-size:13.5px; margin-top:4px; max-width:60ch;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; border-right:4px solid var(--primary);}
.stat-card.accent{border-right-color:var(--accent);}
.stat-card.danger{border-right-color:var(--danger);}
.stat-card.info{border-right-color:var(--info);}
.stat-num{font-size:26px; font-weight:800; color:var(--primary-dark);}
.stat-label{font-size:12.5px; color:var(--ink-soft); margin-top:3px; font-weight:600;}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 18px 8px; margin-bottom:18px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
.panel-head h3{font-size:15.5px;}
.badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.badge-success{background:var(--success-soft); color:var(--success);}
.badge-warn{background:var(--warn-soft); color:var(--warn);}
.badge-danger{background:var(--danger-soft); color:var(--danger);}
.badge-info{background:var(--info-soft); color:var(--info);}
.badge-accent{background:var(--accent-soft); color:#8a6a1f;}
table{width:100%; border-collapse:collapse;}
th{text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:700; padding:9px 8px; border-bottom:1.5px solid var(--border); white-space:nowrap;}
td{padding:11px 8px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.empty-state{padding:38px 20px; text-align:center; color:var(--ink-soft);}
.empty-state h4{color:var(--ink); margin-bottom:6px; font-size:15px;}
.empty-state p{font-size:13px; max-width:40ch; margin:0 auto;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.toolbar input, .toolbar select{padding:9px 12px; border:1.5px solid var(--border); border-radius:9px; background:#fff;}
.tag-pill{background:var(--bg); border:1px solid var(--border); padding:3px 10px; border-radius:20px; font-size:11.5px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(28,35,33,0.5); display:none; align-items:center; justify-content:center; z-index:60; padding:16px;}
.modal{background:var(--surface); border-radius:16px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:22px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.close-x{background:none; border:none; cursor:pointer; font-size:20px; color:var(--ink-soft); line-height:1;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-grid .full{grid-column:1/-1;}
.modal-actions{display:flex; justify-content:flex-start; gap:8px; margin-top:18px; border-top:1px solid var(--border); padding-top:14px;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

#toastHost{position:fixed; bottom:18px; left:18px; z-index:80; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:10px; font-size:13.5px; box-shadow:0 10px 25px -10px rgba(0,0,0,0.4); animation:slideup .18s ease;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
@keyframes slideup{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.clock-card{background:var(--primary-dark); color:#fff; border-radius:16px; padding:26px; text-align:center; margin-bottom:18px;}
.clock-time{font-size:38px; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums;}
.clock-date{font-size:13px; color:#C9D6D0; margin-top:4px;}
.clock-status{margin-top:16px; font-size:13px;}

@media (max-width:900px){
  .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-right:0;}
  .hamburger{display:block;}
  .form-grid{grid-template-columns:1fr;}
  .content{padding:16px 14px 50px;}
  .topbar{padding:12px 14px;}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark"><img src="logo-icon.png" alt="شعار رواحم" style="width:100%; height:100%; object-fit:contain;"></div>
      <div><div class="brand-title">بوابة موظفي رواحم</div><div class="brand-sub">المهام، الحضور، الإجازات والتعاميم</div></div>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="field"><label>اسم المستخدم أو البريد الإلكتروني</label><input id="loginUser" placeholder="اكتب اسم المستخدم أو بريدك الإلكتروني"></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" placeholder="اكتب كلمة المرور"></div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
    <div style="text-align:center; margin-top:10px;">
      <a href="#" onclick="forgotPassword(); return false;" style="font-size:12.5px; color:var(--primary); text-decoration:underline;">نسيت كلمة المرور؟</a>
    </div>
  </div>
</div>

<div id="app">
  <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head"><div class="sidebar-title">بوابة الموظفين</div><div class="sidebar-sub">جمعية رواحم</div></div>
      <nav class="nav" id="navList"></nav>
      <div class="sidebar-foot">جميع الحقوق محفوظة © جمعية رواحم</div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="hamburger" onclick="toggleSidebar(true)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="#1C2321" stroke-width="2" stroke-linecap="round"/></svg></button>
          <div class="topbar-title" id="topbarTitle">لوحة المعلومات</div>
        </div>
        <div class="topbar-right">
          <div class="user-chip"><div class="user-avatar" id="avatarLetter">أ</div><div class="user-meta"><b id="userNameTop"></b><span id="userRoleTop"></span></div></div>
          <button class="btn btn-ghost btn-sm" onclick="doLogout()">خروج</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBox"></div></div>
<div id="toastHost"></div>

<script>
/* =========================================================
   بوابة الموظفين — تشارك نفس قاعدة بيانات النظام الإداري (Firestore)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCVt8BV-SpdIRkDEuZLHUZ1eTfmtqMDqSo",
  authDomain: "rawahem-system.firebaseapp.com",
  projectId: "rawahem-system",
  storageBucket: "rawahem-system.firebasestorage.app",
  messagingSenderId: "488477149213",
  appId: "1:488477149213:web:3f63203c6857c047ca5ef4"
};
let db = null, firebaseReady = false;
let auth = null, authReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  firebaseReady = true;
  authReady = true;
}catch(e){ console.error(e); }

function usernameToEmail(u){
  const clean = (u||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
  return (clean || 'user') + '@rawahem.local';
}
function findProfileByLogin(raw){
  const low = (raw||'').trim().toLowerCase();
  return DB.users.find(x => (x.username && x.username.toLowerCase()===low) || (x.email && x.email.toLowerCase()===low));
}

const KEYS = ['users','tasks','attendance','leaves','emprequests','circulars','programs'];
let DB = {users:[], tasks:[], attendance:[], leaves:[], emprequests:[], circulars:[], programs:[]};
let currentUser = null, currentView = 'dashboard';
const ROLE_LABEL = {admin:'مدير النظام', employee:'موظف الجمعية', board:'عضو مجلس إدارة', auditor:'مراجع خارجي'};

/* ===== التخزين: سجل مستقل لكل مستند (rec_<key>) + قواعد حماية حسب الدور ===== */
let fns = null;
try{ fns = firebase.app().functions('europe-west1'); }catch(err){ console.warn('functions unavailable', err); }
async function callFn(name, data){
  if(!fns) throw {code:'functions/unavailable'};
  const r = await fns.httpsCallable(name)(data||{});
  return r.data;
}
const SNAP = {};
let CLAIMS = {};
function sortNewest(arr){
  const k = r => String(r.createdAt || r.at || '');
  return arr.map((r,i)=>[r,i]).sort((a,b)=>{ const x=k(a[0]), y=k(b[0]); return x===y ? a[1]-b[1] : (x<y?1:-1); }).map(p=>p[0]);
}
/* الموظف العادي يقرأ سجلاته فقط (تسمح القواعد بذلك فقط)؛ المدير يقرأ الكل */
function scopeFor(name){
  if(CLAIMS.role==='admin') return null;
  const u = CLAIMS.username;
  if(name==='tasks') return ['assignedTo','==',u];
  if(name==='attendance' || name==='leaves' || name==='emprequests') return ['username','==',u];
  return null;
}
async function loadKey(name){
  if(!firebaseReady){ return; }
  try{
    let q = db.collection('rec_'+name);
    const sc = scopeFor(name); if(sc) q = q.where(sc[0], sc[1], sc[2]);
    const snap = await q.get();
    const arr = sortNewest(snap.docs.map(d=>d.data()));
    SNAP[name] = {}; arr.forEach(r=>{ SNAP[name][r.id] = JSON.stringify(r); });
    DB[name] = arr;
  }catch(err){ console.error('load failed', name, err); DB[name] = []; }
}
async function saveKey(name){
  if(!firebaseReady){ toast('الخدمة غير متاحة مؤقتًا، حاول لاحقًا','err'); return; }
  try{
    const col = db.collection('rec_'+name);
    const old = SNAP[name] || {}; const cur = {};
    (DB[name]||[]).forEach(r=>{ if(!r.id) r.id = uid(name.slice(0,3)); cur[r.id] = JSON.stringify(r); });
    let batch = db.batch(), n = 0;
    const flush = async ()=>{ if(n){ await batch.commit(); batch = db.batch(); n = 0; } };
    for(const id of Object.keys(cur)){ if(old[id] !== cur[id]){ batch.set(col.doc(String(id)), JSON.parse(cur[id])); if(++n>=400) await flush(); } }
    for(const id of Object.keys(old)){ if(!(id in cur)){ batch.delete(col.doc(String(id))); if(++n>=400) await flush(); } }
    await flush();
    SNAP[name] = cur;
    return true;
  }catch(err){ toast('تعذر الحفظ — قد لا تملك صلاحية هذا الإجراء', 'err'); console.error(err); }
}
async function establishSession(){
  const u = auth.currentUser; if(!u) return {};
  let tk = await u.getIdTokenResult();
  const c = tk.claims || {};
  const ok = (c.role==='family') ? !!c.familyId : (!!c.role && !!c.username);
  if(!ok && fns){
    try{ await callFn('refreshMyClaims'); await u.getIdToken(true); tk = await u.getIdTokenResult(); }
    catch(err){ console.warn('refreshMyClaims', err && err.code, err && err.message); }
  }
  CLAIMS = tk.claims || {};
  if(CLAIMS.role==='admin' && fns){ try{ await callFn('adminMigrate'); }catch(err){ console.warn('migrate', err && err.code); } }
  return CLAIMS;
}
async function loadAll(){
  for(const k of KEYS) await loadKey(k);
}

function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('ar-SA',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('ar-SA')+' '+d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}); }
function fmtTime(iso){ if(!iso) return '—'; return new Date(iso).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg,type){
  const host=document.getElementById('toastHost'); const t=document.createElement('div');
  t.className='toast'+(type==='err'?' err':type==='ok'?' ok':''); t.textContent=msg; host.appendChild(t);
  setTimeout(()=>{t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300);},2600);
}

async function doLogin(){
  const uRaw=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const errBox=document.getElementById('loginError');
  errBox.style.display='none';
  if(!uRaw || !p){ errBox.textContent='يرجى إدخال اسم المستخدم/البريد وكلمة المرور'; errBox.style.display='block'; return; }
  if(!authReady){ errBox.textContent='تعذّر الاتصال بنظام تسجيل الدخول الآمن'; errBox.style.display='block'; return; }
  const btn=document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent='جارٍ التحقق...';
  try{
    const profileBefore = null; /* القراءة قبل تسجيل الدخول غير مسموحة — نشتق البريد من النص المكتوب فقط */
    const email = (uRaw.indexOf('@')>-1 ? uRaw.toLowerCase() : usernameToEmail(uRaw));
    let cred;
    try{
      cred = await auth.signInWithEmailAndPassword(email, p);
    }catch(authErr){
      const legacy = profileBefore && profileBefore.password===p ? profileBefore : null;
      if(legacy && legacy.active){
        cred = await auth.createUserWithEmailAndPassword(email, p);
        legacy.authUid = cred.user.uid;
        legacy.email = email;
        delete legacy.password;
        await saveKey('users');
      } else {
        throw authErr;
      }
    }
    const uidAuth = cred.user.uid;
    await establishSession();
    if(['admin','employee','board','auditor'].indexOf(CLAIMS.role) < 0){
      errBox.textContent='هذا الحساب غير مفعّل لبوابة الموظفين. تواصل مع مدير النظام'; errBox.style.display='block';
      try{ await auth.signOut(); }catch(err){}
      return;
    }
    await loadAll(); /* بعد الدخول فقط يُسمح بقراءة البيانات */
    let profile = DB.users.find(x=>x.authUid===uidAuth);
    if(!profile){ profile = DB.users.find(x=>x.email && x.email.toLowerCase()===(cred.user.email||'').toLowerCase()) || DB.users.find(x=>x.authEmail && x.authEmail.toLowerCase()===(cred.user.email||'').toLowerCase()); if(profile && CLAIMS.role==='admin'){ profile.authUid=uidAuth; await saveKey('users'); } }
    if(!profile){
      profile = findProfileByLogin(uRaw);
      if(profile && CLAIMS.role==='admin'){ profile.authUid = uidAuth; if(profile.password) delete profile.password; await saveKey('users'); }
    }
    if(!profile){
      /* حساب مدير موثّق بصلاحية admin ولا يوجد ملف مطابق: نربطه بملف المدير الوحيد */
      try{
        const tk = await cred.user.getIdTokenResult();
        const admins = DB.users.filter(x=>x.role==='admin' && x.active);
        if(tk.claims && tk.claims.role==='admin' && admins.length===1){ profile = admins[0]; profile.authUid = uidAuth; await saveKey('users'); }
      }catch(e){ console.warn('admin link', e); }
    }
    if(!profile){
      errBox.textContent='تم التحقق من الحساب، لكن لا يوجد ملف صلاحيات مرتبط به. تواصل مع مدير النظام ('+(cred.user.email||'')+' / '+DB.users.length+')';
      errBox.style.display='block';
      try{ await auth.signOut(); }catch(e){}
      return;
    }
    if(!profile.active){
      errBox.textContent='هذا الحساب موقوف'; errBox.style.display='block';
      try{ await auth.signOut(); }catch(e){}
      return;
    }
    currentUser=profile; enterApp();
  }catch(e){
    console.error(e);
    errBox.textContent='اسم المستخدم أو كلمة المرور غير صحيحة'; errBox.style.display='block';
  }finally{
    btn.disabled=false; btn.textContent='تسجيل الدخول';
  }
}

function buildTable(columns, rows, actionsFn, emptyTitle, emptyDesc){
  if(!rows.length){ const e=document.createElement('div'); e.className='empty-state'; e.innerHTML='<h4>'+esc(emptyTitle)+'</h4><p>'+esc(emptyDesc)+'</p>'; return e; }
  const wrap=document.createElement('div'); wrap.style.overflowX='auto';
  const t=document.createElement('table'); const thead=document.createElement('tr');
  columns.forEach(c=>{ const th=document.createElement('th'); th.textContent=c.label; thead.appendChild(th); });
  if(actionsFn){ const th=document.createElement('th'); th.textContent=''; thead.appendChild(th); }
  t.appendChild(thead);
  rows.forEach(row=>{
    const tr=document.createElement('tr');
    columns.forEach(c=>{ const td=document.createElement('td'); if(c.html) td.innerHTML=c.render(row); else td.textContent=c.render?c.render(row):(row[c.key]??'—'); tr.appendChild(td); });
    if(actionsFn){ const td=document.createElement('td'); const div=document.createElement('div'); div.className='row-actions';
      actionsFn(row).forEach(a=>{ const b=document.createElement('button'); b.className='btn btn-sm '+(a.variant||'btn-outline'); b.textContent=a.label; b.onclick=a.onClick; div.appendChild(b); });
      td.appendChild(div); tr.appendChild(td); }
    t.appendChild(tr);
  });
  wrap.appendChild(t); return wrap;
}
function openModal(title, fields, initial, onSubmit){
  const backdrop=document.getElementById('modalBackdrop'); const box=document.getElementById('modalBox'); initial=initial||{};
  let html='<div class="modal-head"><h3>'+esc(title)+'</h3><button class="close-x" onclick="closeModal()">&times;</button></div><div class="form-grid">';
  fields.forEach(f=>{
    const val=initial[f.key]!==undefined?initial[f.key]:(f.default!==undefined?f.default:'');
    html+='<div class="field '+(f.full?'full':'')+'"><label>'+esc(f.label)+(f.required?' *':'')+'</label>';
    if(f.type==='select'){ html+='<select id="mf_'+f.key+'">'+f.options.map(o=>'<option value="'+esc(o.value)+'" '+(String(val)===String(o.value)?'selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select>'; }
    else if(f.type==='textarea'){ html+='<textarea id="mf_'+f.key+'" rows="3">'+esc(val)+'</textarea>'; }
    else { html+='<input type="'+(f.type||'text')+'" id="mf_'+f.key+'" value="'+esc(val)+'">'; }
    if(f.hint) html+='<div class="hint">'+esc(f.hint)+'</div>';
    html+='</div>';
  });
  html+='</div><div class="modal-actions"><button class="btn btn-primary" id="modalSubmitBtn">حفظ</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>';
  box.innerHTML=html; backdrop.style.display='flex';
  document.getElementById('modalSubmitBtn').onclick=async ()=>{
    const out={}; let ok=true;
    for(const f of fields){ const elm=document.getElementById('mf_'+f.key); if(!elm) continue;
      const v=elm.value.trim(); if(f.required && !v){ toast('يرجى تعبئة: '+f.label,'err'); ok=false; break; } out[f.key]=v; }
    if(!ok) return; await onSubmit(out); closeModal();
  };
}
function closeModal(){ document.getElementById('modalBackdrop').style.display='none'; document.getElementById('modalBox').innerHTML=''; }
function confirmDialog(title,msg,onYes){
  const box=document.getElementById('modalBox');
  box.innerHTML='<div class="modal-head"><h3>'+esc(title)+'</h3><button class="close-x" onclick="closeModal()">&times;</button></div><p style="font-size:14px; color:var(--ink-soft); line-height:1.7;">'+esc(msg)+'</p><div class="modal-actions"><button class="btn btn-danger" id="cfYes">تأكيد</button><button class="btn btn-ghost" onclick="closeModal()">تراجع</button></div>';
  document.getElementById('modalBackdrop').style.display='flex';
  document.getElementById('cfYes').onclick=async()=>{ await onYes(); closeModal(); };
}

function renderRequests(c){
  const head=document.createElement('div'); head.className='page-head';
  head.innerHTML='<div><h2>الطلبات الإدارية</h2><div class="page-desc">'+(isAdmin()?'مراجعة الطلبات الإدارية المقدَّمة من الموظفين.':'تقديم طلب إداري (سلفة، شكوى، استفسار...) ومتابعته.')+'</div></div>';
  if(!isAdmin()){ const b=document.createElement('button'); b.className='btn btn-primary'; b.textContent='+ طلب جديد'; b.onclick=()=>openReqModal(); head.appendChild(b); }
  c.appendChild(head);
  const rows=isAdmin()?DB.emprequests:DB.emprequests.filter(r=>r.username===currentUser.username);
  const sorted=[...rows].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  c.appendChild(buildTable(
    [{label:'النوع',render:r=>r.type}].concat(isAdmin()?[{label:'الموظف',render:r=>r.name}]:[]).concat([
     {label:'الموضوع',render:r=>r.subject},
     {label:'الحالة',html:true,render:r=>r.status==='معتمد'?'<span class="badge badge-success">معتمد</span>':r.status==='مرفوض'?'<span class="badge badge-danger">مرفوض</span>':'<span class="badge badge-warn">قيد المراجعة</span>'}]),
    sorted,
    (r)=>{
      if(isAdmin() && r.status==='قيد المراجعة') return [
        {label:'اعتماد', variant:'btn-primary', onClick:async()=>{r.status='معتمد'; r.reviewedBy=currentUser.name; r.reviewedAt=nowIso(); await saveKey('emprequests'); navigate('requests');}},
        {label:'رفض', variant:'btn-danger', onClick:async()=>{r.status='مرفوض'; r.reviewedBy=currentUser.name; r.reviewedAt=nowIso(); await saveKey('emprequests'); navigate('requests');}}
      ];
      return [];
    },
    'لا توجد طلبات', isAdmin()?'':'قدّم طلبك الأول من الزر أعلاه.'
  ));
}
function openReqModal(){
  openModal('طلب إداري جديد',[
    {key:'type', label:'نوع الطلب', type:'select', options:REQ_TYPES.map(x=>({value:x,label:x})), required:true},
    {key:'subject', label:'الموضوع', required:true, full:true},
    {key:'description', label:'التفاصيل', type:'textarea', full:true},
  ], {}, async(vals)=>{
    DB.emprequests.unshift({id:uid('er'), username:currentUser.username, name:currentUser.name, type:vals.type, subject:vals.subject, description:vals.description||'', status:'قيد المراجعة', createdAt:nowIso()});
    await saveKey('emprequests'); toast('تم إرسال الطلب','ok'); navigate('requests');
  });
}

/* ============ CIRCULARS ============ */
function renderCirculars(c){
  const head=document.createElement('div'); head.className='page-head';
  head.innerHTML='<div><h2>التعاميم</h2><div class="page-desc">إشعارات وتعاميم رسمية من إدارة الجمعية.</div></div>';
  if(isAdmin()){ const b=document.createElement('button'); b.className='btn btn-primary'; b.textContent='+ نشر تعميم'; b.onclick=()=>openCircularModal(); head.appendChild(b); }
  c.appendChild(head);
  const sorted=[...DB.circulars].sort((a,b)=>new Date(b.postedAt)-new Date(a.postedAt));
  if(!sorted.length){ c.appendChild(buildTable([],[],null,'لا توجد تعاميم بعد','ستظهر هنا أي تعاميم تنشرها الإدارة.')); return; }
  sorted.forEach(cir=>{
    const p=document.createElement('div'); p.className='panel';
    p.innerHTML='<div class="panel-head"><h3>'+esc(cir.title)+'</h3><span class="tag-pill">'+fmtDate(cir.postedAt)+'</span></div><p style="font-size:13.5px; color:var(--ink-soft); line-height:1.8;">'+esc(cir.body)+'</p><p style="font-size:11.5px; color:var(--ink-soft); margin-top:10px;">بواسطة '+esc(cir.postedBy)+'</p>';
    c.appendChild(p);
  });
}
function openCircularModal(){
  openModal('نشر تعميم جديد',[
    {key:'title', label:'العنوان', required:true, full:true},
    {key:'body', label:'نص التعميم', type:'textarea', required:true, full:true},
  ], {}, async(vals)=>{
    DB.circulars.unshift({id:uid('cir'), title:vals.title, body:vals.body, postedBy:currentUser.name, postedAt:nowIso()});
    await saveKey('circulars'); toast('تم نشر التعميم','ok'); navigate('circulars');
  });
}

/* ============ PROGRAMS ============ */
function renderPrograms(c){
  const head=document.createElement('div'); head.className='page-head';
  head.innerHTML='<div><h2>البرامج والمشاريع</h2><div class="page-desc">'+(isAdmin()?'إنشاء البرامج وتعيين فريق العمل المسؤول.':'البرامج التي تشارك فيها حاليًا.')+'</div></div>';
  if(isAdmin()){ const b=document.createElement('button'); b.className='btn btn-primary'; b.textContent='+ برنامج جديد'; b.onclick=()=>openProgramModal(); head.appendChild(b); }
  c.appendChild(head);
  const rows=isAdmin()?DB.programs:DB.programs.filter(p=>(p.assigned||[]).includes(currentUser.username));
  c.appendChild(buildTable(
    [{label:'اسم البرنامج',render:r=>r.name}, {label:'الوصف',render:r=>r.description||'—'},
     {label:'الحالة',html:true,render:r=>'<span class="badge '+(r.status==='نشط'?'badge-success':'badge-warn')+'">'+esc(r.status)+'</span>'},
     {label:'الفريق',render:r=>(r.assigned||[]).map(u=>{const x=DB.users.find(y=>y.username===u); return x?x.name:u;}).join('، ')||'—'}],
    rows,
    isAdmin()?(r)=>[{label:'حذف', variant:'btn-danger', onClick:()=>confirmDialog('حذف البرنامج','سيتم حذف "'+r.name+'".',async()=>{DB.programs=DB.programs.filter(x=>x.id!==r.id); await saveKey('programs'); navigate('programs');})}]:null,
    'لا توجد برامج', isAdmin()?'أنشئ أول برنامج وعيّن فريق العمل.':'لم تُعيَّن على أي برنامج حاليًا.'
  ));
}
function openProgramModal(){
  const employees=DB.users.filter(u=>u.active && u.role==='employee');
  let html='<div class="modal-head"><h3>برنامج جديد</h3><button class="close-x" onclick="closeModal()">&times;</button></div><div class="form-grid">'+
    '<div class="field full"><label>اسم البرنامج *</label><input id="pf_name"></div>'+
    '<div class="field full"><label>الوصف</label><textarea id="pf_desc" rows="2"></textarea></div>'+
    '<div class="field"><label>الحالة</label><select id="pf_status"><option value="نشط">نشط</option><option value="متوقف">متوقف</option></select></div>'+
    '<div class="field full"><label>فريق العمل</label>'+employees.map(u=>'<label style="display:flex; align-items:center; gap:6px; font-size:13px; margin-bottom:6px;"><input type="checkbox" class="pf_emp" value="'+esc(u.username)+'"> '+esc(u.name)+'</label>').join('')+'</div>'+
    '</div><div class="modal-actions"><button class="btn btn-primary" id="pfSubmit">حفظ</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>';
  document.getElementById('modalBox').innerHTML=html;
  document.getElementById('modalBackdrop').style.display='flex';
  document.getElementById('pfSubmit').onclick=async()=>{
    const name=document.getElementById('pf_name').value.trim();
    if(!name){ toast('يرجى إدخال اسم البرنامج','err'); return; }
    const assigned=Array.from(document.querySelectorAll('.pf_emp:checked')).map(x=>x.value);
    DB.programs.unshift({id:uid('prg'), name, description:document.getElementById('pf_desc').value.trim(), status:document.getElementById('pf_status').value, assigned, createdAt:nowIso()});
    await saveKey('programs'); toast('تم إنشاء البرنامج','ok'); closeModal(); navigate('programs');
  };
}

/* =========================================================
   حسابي — تحديث البريد الإلكتروني الحقيقي لتفعيل "نسيت كلمة المرور"
   ========================================================= */
function renderAccount(c){
  const head=document.createElement('div'); head.className='page-head';
  head.innerHTML='<div><h2>حسابي</h2><div class="page-desc">بيانات حسابك في النظام، وتحديث بريدك الإلكتروني الحقيقي حتى تعمل ميزة "نسيت كلمة المرور".</div></div>';
  c.appendChild(head);
  const hasRealEmail = currentUser.email && !currentUser.email.endsWith('@rawahem.local');
  const panel=document.createElement('div'); panel.className='panel';
  panel.innerHTML = '<p style="font-size:13.5px; line-height:2.4;">'+
    'الاسم: <b>'+esc(currentUser.name)+'</b><br>'+
    'اسم المستخدم: <b>'+esc(currentUser.username)+'</b><br>'+
    'الدور: <b>'+esc(ROLE_LABEL[currentUser.role]||currentUser.role)+'</b><br>'+
    'البريد الإلكتروني الحقيقي: <b>'+(hasRealEmail?esc(currentUser.email):'<span style="color:var(--danger)">لم يُسجَّل بعد</span>')+'</b>'+
    (hasRealEmail && currentUser.emailPendingVerification ? ' <span class="badge badge-warn">بانتظار تأكيدك عبر الرابط المُرسَل إلى بريدك</span>' : '')+
    '</p>'+
    (!hasRealEmail ? '<div class="login-error" style="display:block; margin-top:4px;">بدون بريد إلكتروني حقيقي، لن تتمكن من استخدام "نسيت كلمة المرور" لاسترجاع حسابك. يُنصح بإضافته الآن.</div>' : '')+
    (hasRealEmail && currentUser.emailPendingVerification ? '<div class="login-error" style="display:block; margin-top:4px; background:var(--warn-soft); color:var(--warn);">لم يصبح هذا البريد بريد الدخول الفعلي بعد — افتح الرسالة المرسلة إليه واضغط رابط التأكيد أولًا، وإلا فلن تعمل "نسيت كلمة المرور".</div>' : '');
  c.appendChild(panel);
  const b=document.createElement('button'); b.className='btn btn-primary'; b.textContent=hasRealEmail?'تحديث البريد الإلكتروني':'إضافة بريد إلكتروني حقيقي';
  b.onclick=()=>{
    const box=document.getElementById('modalBox');
    box.innerHTML =
      '<div class="modal-head"><h3>البريد الإلكتروني</h3><button class="close-x" onclick="closeModal()">&times;</button></div>'+
      '<div class="login-error" id="accEmailErr" style="display:none;"></div>'+
      '<div class="field"><label>البريد الإلكتروني *</label><input id="acc_email" type="email" value="'+(hasRealEmail?esc(currentUser.email):'')+'"></div>'+
      '<div class="modal-actions"><button class="btn btn-primary" id="accEmailSubmit">حفظ</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>';
    document.getElementById('modalBackdrop').style.display='flex';
    document.getElementById('accEmailSubmit').onclick = async ()=>{
      const errBox=document.getElementById('accEmailErr'); errBox.style.display='none';
      const newEmail=(document.getElementById('acc_email').value||'').trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)){ errBox.textContent='يرجى إدخال بريد إلكتروني صحيح'; errBox.style.display='block'; return; }
      if(DB.users.some(u=>u.id!==currentUser.id && u.email===newEmail)){ errBox.textContent='هذا البريد مستخدم بالفعل لحساب آخر'; errBox.style.display='block'; return; }
      try{
        /* نستخدم verifyBeforeUpdateEmail بدل updateEmail مباشرة: Firebase يرسل رابط تأكيد
           إلى البريد الجديد أولًا، ولا يصبح بريد الدخول الفعلي إلا بعد الضغط عليه —
           هذا يعمل في كل مشاريع Firebase بغض النظر عن إعداداتها، ويثبت أن البريد قابل للتسليم فعليًا */
        await auth.currentUser.verifyBeforeUpdateEmail(newEmail);
        currentUser.email = newEmail;
        currentUser.emailPendingVerification = true;
        await saveKey('users');
        closeModal();
        toast('تم إرسال رابط تأكيد إلى '+newEmail+' — افتح بريدك (وتحقق من مجلد الرسائل غير المرغوب فيها) واضغط الرابط لتفعيله','ok');
        navigate('account');
      }catch(e){
        console.error(e);
        if(e.code==='auth/requires-recent-login'){ errBox.textContent='لأسباب أمنية، يرجى تسجيل الخروج والدخول مجددًا ثم إعادة المحاولة'; }
        else if(e.code==='auth/email-already-in-use'){ errBox.textContent='هذا البريد مستخدم بالفعل في نظام الدخول'; }
        else{ errBox.textContent='تعذّر إرسال رابط التأكيد، تحقق من الاتصال وحاول لاحقًا'; }
        errBox.style.display='block';
      }
    };
  };
  c.appendChild(b);
  const pw=document.createElement('button'); pw.className='btn btn-outline'; pw.style.marginInlineStart='8px'; pw.textContent='تغيير كلمة المرور'; pw.onclick=openChangePassword; c.appendChild(pw);
}



/* ===== تصدير CSV (يفتح في Excel بالعربية) ===== */
function downloadCSV(filename, header, rows){
  const q = v=>{ let s = (v===undefined||v===null) ? '' : String(v); if(/^[=+\-@\t\r]/.test(s)) s = "'"+s; return '"'+s.replace(/"/g,'""')+'"'; };
  const lines = [header.map(q).join(',')].concat(rows.map(r=>r.map(q).join(',')));
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename+'-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function csvButton(label, onClick){
  const b = document.createElement('button'); b.className='btn btn-outline'; b.style.marginInlineStart='8px'; b.textContent = label; b.onclick = onClick; return b;
}

/* ===== إضافات الأمان: تغيير كلمة المرور + خروج تلقائي عند الخمول ===== */
function openChangePassword(){
  const box=document.getElementById('modalBox');
  box.innerHTML =
    '<div class="modal-head"><h3>تغيير كلمة المرور</h3><button class="close-x" onclick="closeModal()">&times;</button></div>'+
    '<div class="login-error" id="cpErr" style="display:none;"></div>'+
    '<div class="field"><label>كلمة المرور الحالية *</label><input id="cp_old" type="password" autocomplete="current-password"></div>'+
    '<div class="field"><label>كلمة المرور الجديدة * (10 أحرف فأكثر، فيها حروف وأرقام)</label><input id="cp_new" type="password" autocomplete="new-password"></div>'+
    '<div class="field"><label>تأكيد كلمة المرور الجديدة *</label><input id="cp_new2" type="password" autocomplete="new-password"></div>'+
    '<div class="modal-actions"><button class="btn btn-primary" id="cpSubmit">تغيير</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>';
  document.getElementById('modalBackdrop').style.display='flex';
  document.getElementById('cpSubmit').onclick = async ()=>{
    const err=document.getElementById('cpErr'); err.style.display='none';
    const o=document.getElementById('cp_old').value, n=document.getElementById('cp_new').value, n2=document.getElementById('cp_new2').value;
    const fail=(m)=>{ err.textContent=m; err.style.display='block'; };
    if(!o||!n){ return fail('أدخل كلمة المرور الحالية والجديدة'); }
    if(n.length<10 || !/[A-Za-z؀-ۿ]/.test(n) || !/[0-9]/.test(n)){ return fail('كلمة المرور الجديدة يجب أن تكون 10 أحرف فأكثر وتحتوي حروفًا وأرقامًا'); }
    if(n!==n2){ return fail('تأكيد كلمة المرور غير مطابق'); }
    if(n===o){ return fail('كلمة المرور الجديدة يجب أن تختلف عن الحالية'); }
    const btn=document.getElementById('cpSubmit'); btn.disabled=true; btn.textContent='جارٍ التغيير...';
    try{
      const u=auth.currentUser;
      const cred=firebase.auth.EmailAuthProvider.credential(u.email,o);
      await u.reauthenticateWithCredential(cred);
      await u.updatePassword(n);
      closeModal(); toast('تم تغيير كلمة المرور بنجاح','ok');
    }catch(e){
      console.error(e);
      if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'){ fail('كلمة المرور الحالية غير صحيحة'); }
      else if(e.code==='auth/too-many-requests'){ fail('محاولات كثيرة، حاول لاحقًا'); }
      else{ fail('تعذّر تغيير كلمة المرور، حاول لاحقًا'); }
      btn.disabled=false; btn.textContent='تغيير';
    }
  };
}
(function(){
  const IDLE_MS = 20*60*1000, WARN_MS = 18*60*1000;
  let tWarn=null, tOut=null, warned=false;
  function reset(){
    if(!currentUser) return;
    if(warned){ const w=document.getElementById('idleWarn'); if(w) w.remove(); warned=false; }
    clearTimeout(tWarn); clearTimeout(tOut);
    tWarn=setTimeout(()=>{
      if(!currentUser) return; warned=true;
      const d=document.createElement('div'); d.id='idleWarn';
      d.style.cssText='position:fixed; bottom:18px; right:18px; left:18px; max-width:420px; margin:auto; background:#1f2937; color:#fff; padding:12px 16px; border-radius:12px; z-index:99999; font-size:13.5px; text-align:center;';
      d.textContent='سيتم تسجيل خروجك تلقائيًا بعد دقيقتين لعدم النشاط. حرّك الماوس أو المس الشاشة للبقاء.';
      document.body.appendChild(d);
    }, WARN_MS);
    tOut=setTimeout(async()=>{ if(currentUser){ const w=document.getElementById('idleWarn'); if(w) w.remove(); warned=false; await doLogout(); try{ toast('تم تسجيل خروجك تلقائيًا لعدم النشاط','err'); }catch(e){} } }, IDLE_MS);
  }
  ['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, reset, {passive:true}));
  const _enter = enterApp;
  enterApp = function(){ const r=_enter.apply(this, arguments); reset(); return r; };
})();

(async function boot(){
  if(authReady){
    auth.onAuthStateChanged(async (user)=>{
      if(user && !currentUser){
        await establishSession();
        if(['admin','employee','board','auditor'].indexOf(CLAIMS.role) < 0){ try{ await auth.signOut(); }catch(err){} return; }
        await loadAll();
        let profile = DB.users.find(x=>x.authUid===user.uid) || DB.users.find(x=>x.email && x.email.toLowerCase()===(user.email||'').toLowerCase());
        if(profile && profile.active){ currentUser = profile; enterApp(); }
        else if(profile && !profile.active){ try{ await auth.signOut(); }catch(e){} }
      }
    });
  }
})();
